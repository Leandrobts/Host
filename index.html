        #status-text {

            color: #ccc;
            flex: 1;
        }

        #attempt-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #444;
            margin-bottom: 12px;
            padding: 0 2px;
        }

        #console {
            width: 100%;
            max-width: 700px;
            height: 400px;
            background: #06060c;
            border: 1px solid #1a1a2e;
            border-radius: 6px;
            overflow-y: auto;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .log-line { padding: 1px 0; word-break: break-all; }

        .log-ok      { color: #00c853; font-weight: bold; }
        .log-warn    { color: #f0a500; }

        .log-addr    { color: #bd93f9; }

            border-top: 1px solid #1a1a2e;

            gap: 8px;
            margin-bottom: 12px;

        #bases-grid.visible { display: grid; }

        .base-card {

            border-radius: 6px;

    const el = document.createElement('div');
    el.className = 'log-line ' + cls;
    el.textContent = msg;
    $console.appendChild(el);
    $console.scrollTop = $console.scrollHeight;

    $dot.className = state;

    $stageTxt.textContent = `estágio: ${tag.toLowerCase()}`;
