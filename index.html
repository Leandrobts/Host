<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 WebKit Exploit (13.52)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            font-size: 18px;
            color: #00c8ff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-align: center;
        }
        #fw-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 18px;
            text-align: center;
            letter-spacing: 2px;
        }
        #status-bar {
            width: 100%;
            max-width: 700px;
            background: #111118;
            border: 1px solid #1e1e2e;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        #status-dot.running  { background: #f0a500; animation: pulse 1s infinite; }
        #status-dot.ok       { background: #00c853; }
        #status-dot.error    { background: #ff3d3d; }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }
        #status-text {
            font-size: 13px;
            color: #ccc;
            flex: 1;
        }
        #attempt-bar {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #444;
            margin-bottom: 12px;
            padding: 0 2px;
        }
        #console {
            width: 100%;
            max-width: 700px;
            height: 400px;
            background: #06060c;
            border: 1px solid #1a1a2e;
            border-radius: 6px;
            overflow-y: auto;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .LOG-DEBUG { color: #888; }
        .LOG-INFO  { color: #7ec8e3; }
        .LOG-LOG   { color: #ccc; }
        .LOG-WARN  { color: #f0a500; }
        .LOG-ERROR { color: #ff5252; font-weight: bold; }
        .LOG-SUCCESS { color: #00c853; font-weight: bold; }
    </style>
</head>
<body>

<h1>PS4 WebKit Exploit</h1>
<div id="fw-label">firmware 13.52</div>

<div id="status-bar">
    <div id="status-dot"></div>
    <div id="status-text">Inicializando...</div>
</div>

<div id="attempt-bar">
    <span id="attempt-text">tentativa: —</span>
    <span id="stage-text">estágio: —</span>
</div>

<div id="console"></div>

<!-- Carrega o arquivo de offsets do firmware -->
<script src="./13.52.js?v=1"></script>

<script type="module">
import { int64 } from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP } from './resources/mem.js';

globalThis.int64 = int64;

const $dot        = document.getElementById('status-dot');
const $statusText = document.getElementById('status-text');
const $attemptTxt = document.getElementById('attempt-text');
const $stageTxt   = document.getElementById('stage-text');

function setStatus(msg, state = 'running') {
    $statusText.textContent = msg;
    $dot.className = state;
}

function onCoreEvent(tag, detail, attempt) {
    if (attempt !== undefined)
        $attemptTxt.textContent = `tentativa: ${attempt}`;
    $stageTxt.textContent = `estágio: ${tag.toLowerCase()}`;
}

(async () => {
    setStatus('Rodando exploit JSC (core.js)…', 'running');

    let carrier;
    try {
        carrier = await establishPrimitive({
            onEvent: onCoreEvent,
            maxAttempts: 0
        });
    } catch (err) {
        setStatus('core.js falhou: ' + err.message, 'error');
        return;
    }

    setStatus('Instalando R/W arbitrário...', 'running');

    let p;
    try {
        p = installWindowP(carrier, { promote: true });
    } catch (err) {
        setStatus('mem.js falhou: ' + err.message, 'error');
        return;
    }

    setStatus('Primitiva pronta — Carregando main.js', 'ok');

    // Carrega o main.js que agora exibirá a base calculada na tela
    let mainScript = document.createElement('script');
    mainScript.src = './main.js?v=1';
    document.body.appendChild(mainScript);
})();
</script>
</body>
</html>
