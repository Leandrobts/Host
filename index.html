
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 13.52 — Slopkit Port</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#00ff88;font:13px/1.6 'Courier New',monospace;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:16px;color:#00c8ff;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
#fw{color:#666;font-size:11px;margin-bottom:14px;letter-spacing:1px}

#sb{width:100%;max-width:700px;background:#111118;border:1px solid #1e1e2e;
  border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#dot{width:9px;height:9px;border-radius:50%;background:#333;flex-shrink:0}
#dot.r{background:#f0a500;animation:pulse 1s infinite}
#dot.ok{background:#00c853}
#dot.e{background:#ff4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
#st{font-size:12px;color:#bbb;flex:1}

#con{width:100%;max-width:700px;height:320px;background:#050508;border:1px solid #1a1a2e;
  border-radius:6px;overflow-y:auto;padding:8px 10px;font-size:11px;line-height:1.6;margin-bottom:10px}
.l{padding:1px 0;word-break:break-all}
.li{color:#5b9bd5}.lo{color:#00c853;font-weight:bold}.lw{color:#f0a500}
.le{color:#ff5252;font-weight:bold}.ld{color:#444}.la{color:#bd93f9}
.ls{color:#00c8ff;border-top:1px solid #1a1a2e;margin-top:5px;padding-top:5px}

#cards{width:100%;max-width:700px;display:none;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
#cards.v{display:grid}
.card{background:#0b0d1a;border:1px solid #1a1d2e;border-radius:5px;padding:8px 12px}
.card .cl{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:2px;margin-bottom:3px}
.card .cv{font-size:12px;color:#bd93f9}
</style>
</head>
<body>

<h1>PS4 WebKit Exploit</h1>
<div id="fw">13.52 — Slopkit Port</div>

<div id="sb">
  <div id="dot"></div>
  <div id="st">Inicializando...</div>
</div>

<div id="con"></div>

<div id="cards">
  <div class="card"><div class="cl">WebKit Base</div><div class="cv" id="c-wk">—</div></div>
  <div class="card"><div class="cl">libkernel Base</div><div class="cv" id="c-lk">—</div></div>
  <div class="card"><div class="cl">libc Base</div><div class="cv" id="c-lc">—</div></div>
  <div class="card"><div class="cl">__ps5NativeCtor</div><div class="cv" id="c-ct">—</div></div>
</div>

<!-- Dependências do slopkit -->
<script src="resources/int64.js"></script>
<script src="resources/core.js"></script>
<script src="resources/mem.js" type="module"></script>

<!-- O main.js carrega ./13.52.js dinamicamente -->
<script src="resources/main.js"></script>

<script>
const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');

function log(msg, cls='li') {
  const d = document.createElement('div');
  d.className = 'l ' + cls;
  d.textContent = msg;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
}
function setStatus(msg, state='r') {
  $st.textContent = msg;
  $dot.className = state;
}
function setCard(id, val) {
  const el = document.getElementById(id);
  if(el){el.textContent=val;el.style.color='#00ff88';}
}

// Expor helpers globalmente para o main.js usar
window._hostLog = log;
window._hostSetStatus = setStatus;
window._hostSetCard = setCard;

log('=== PS4 13.52 Slopkit Port ===', 'ls');
log('Aguardando core.js + mem.js...', 'li');

// O main.js do slopkit vai chamar prepare() e main() automaticamente
// quando o 13.52.js for carregado. Não precisamos fazer nada aqui.
</script>
</body>
</html>
